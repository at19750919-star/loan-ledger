  /* 讓視窗至少留一截標題列在畫面內，換螢幕或縮視窗都不會消失 */
  function clampChatPos(pos) {
    const margin = 48;
    const maxX = Math.max(0, window.innerWidth - margin);
    const maxY = Math.max(0, window.innerHeight - margin);
    return {
      x: Math.round(Math.min(Math.max(pos.x, margin - pos.w), maxX)),
      y: Math.round(Math.min(Math.max(pos.y, 0), maxY)),
      w: Math.round(pos.w),
      h: Math.round(pos.h)
    };
  }

  function applyChatPos(pos) {
    const panel = document.getElementById("ai-chat-panel");
    if (!pos || chatDragDisabled()) {
      panel.classList.remove("is-dragged");
      panel.style.left = panel.style.top = panel.style.width = panel.style.height = "";
      return;
    }
    chatPos = clampChatPos(pos);
    panel.classList.add("is-dragged");
    panel.style.left = chatPos.x + "px";
    panel.style.top = chatPos.y + "px";
    panel.style.width = chatPos.w + "px";
    panel.style.height = chatPos.h + "px";
  }

  function resetChatPos() {
    chatPos = null;
    saveChatPos(null);
    applyChatPos(null);
  }

  function startChatDrag(e) {
    if (chatDragDisabled()) return;
    if (e.button !== undefined && e.button !== 0) return;
    if (e.target.closest("button, input, textarea, a")) return;

    const head = document.getElementById("ai-chat-head");
    const panel = document.getElementById("ai-chat-panel");
    const rect = panel.getBoundingClientRect();
    const grabX = e.clientX - rect.left;
    const grabY = e.clientY - rect.top;
    const size = { w: rect.width, h: rect.height };

    head.classList.add("is-grabbing");
    try { head.setPointerCapture(e.pointerId); } catch (err) { /* 指標擷取失敗仍可用 window 事件 */ }

    function onMove(ev) {
      applyChatPos({ x: ev.clientX - grabX, y: ev.clientY - grabY, w: size.w, h: size.h });
    }

    function onUp() {
      head.classList.remove("is-grabbing");
      window.removeEventListener("pointermove", onMove);
      window.removeEventListener("pointerup", onUp);
      window.removeEventListener("pointercancel", onUp);
      if (chatPos) saveChatPos(chatPos);
    }

    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onUp);
    window.addEventListener("pointercancel", onUp);
  }

  function openAiChat(focusComposer) {
    const shell = document.getElementById("ai-chat-shell");
    if (!shell.classList.contains("is-open")) {
      aiLastFocus = document.activeElement;
    }
    shell.classList.add("is-open");
    shell.setAttribute("aria-hidden", "false");
    document.getElementById("ai-chat-open").setAttribute("aria-expanded", "true");
    if (chatPos) applyChatPos(chatPos);
    if (focusComposer !== false) {
      document.getElementById("ai-dialog-input").focus();
    }
  }

  function closeAiChat() {
    const shell = document.getElementById("ai-chat-shell");
    shell.classList.remove("is-open");
    shell.setAttribute("aria-hidden", "true");
    document.getElementById("ai-chat-open").setAttribute("aria-expanded", "false");
    if (aiLastFocus && typeof aiLastFocus.focus === "function") aiLastFocus.focus();
  }

  function driveFileId(url) {
    const source = String(url || "");
    const match = source.match(/\/file\/d\/([^/]+)/) || source.match(/[?&]id=([^&]+)/);
    return match ? match[1] : "";
  }

  function openArenaImage(url, label) {
    const lightbox = document.getElementById("arena-image-lightbox");
    const image = document.getElementById("arena-image-img");
    const frame = document.getElementById("arena-image-frame");
    const fallback = document.getElementById("arena-image-fallback");
    const fileId = driveFileId(url);

    document.getElementById("arena-image-title").textContent = (label || "圖片") + "預覽";
    fallback.href = url;
    image.style.display = "block";
    frame.style.display = "none";
    frame.removeAttribute("src");
    image.alt = (label || "圖片") + "預覽";
    image.onerror = function () {
      image.style.display = "none";
      if (fileId) {
        frame.src = "https://drive.google.com/file/d/" + encodeURIComponent(fileId) + "/preview";
        frame.style.display = "block";
      }
    };
    image.src = fileId
      ? "https://drive.google.com/thumbnail?id=" + encodeURIComponent(fileId) + "&sz=w1600"
      : url;
    lightbox.classList.add("is-open");
    lightbox.setAttribute("aria-hidden", "false");
    document.getElementById("arena-image-close").focus();
  }

  function closeArenaImage() {
    const lightbox = document.getElementById("arena-image-lightbox");
    const image = document.getElementById("arena-image-img");
    const frame = document.getElementById("arena-image-frame");
    lightbox.classList.remove("is-open");
    lightbox.setAttribute("aria-hidden", "true");
    image.removeAttribute("src");
    frame.removeAttribute("src");
  }

  /* 同一天只顯示時間，跨天的舊訊息補上日期 */
  function chatStampLabel(stamp) {
    const s = String(stamp || "");
    const parts = s.split(" ");
    if (parts.length < 2) return s;
    return parts[0] === fullStamp().split(" ")[0] ? parts[1] : s;
  }

  function renderAiMessage(cls, text, role, stamp) {
    const el = document.getElementById("ai-output");
    const empty = document.getElementById("ai-chat-empty");
    if (empty) {
      aiEmptyNode = empty;
      empty.remove();
    }

    const message = document.createElement("article");
    const messageRole = role === "user" ? "user" : "assistant";
    message.className = "ai-message " + messageRole;
    if (cls === "err-line") message.classList.add("error");
    if (cls === "warn-line") message.classList.add("warning");

    const meta = document.createElement("div");
    meta.className = "ai-message-meta";
    const speaker = document.createElement("span");
    speaker.textContent = messageRole === "user" ? "你" : "營運助理";
    const time = document.createElement("time");
    time.textContent = chatStampLabel(stamp);
    meta.appendChild(speaker);
    meta.appendChild(time);

    const copy = document.createElement("div");
    copy.className = "ai-message-copy";
    copy.textContent = String(text || "");
    message.appendChild(meta);
    message.appendChild(copy);

    const typing = document.getElementById("ai-chat-typing");
    el.insertBefore(message, typing);
    el.scrollTop = el.scrollHeight;
  }

  function pushAiResponse(cls, text, role) {
    const entry = {
      cls: cls || "",
      text: String(text || ""),
      role: role === "user" ? "user" : "assistant",
      t: fullStamp()
    };
    chatLog.push(entry);
    if (chatLog.length > MAX_CHAT_LOG) chatLog.splice(0, chatLog.length - MAX_CHAT_LOG);
    saveChatLog();
    renderAiMessage(entry.cls, entry.text, entry.role, entry.t);
  }

  /* 對話簿與送給 AI 的上下文一起存，重開頁面才接得上 */
  function saveChatLog() {
    try {
      localStorage.setItem(LS_CHAT_LOG, JSON.stringify({ log: chatLog, history: aiHistory }));
    } catch (e) { /* ignore quota */ }
  }

  function restoreChatLog() {
    let data = null;
    try { data = JSON.parse(localStorage.getItem(LS_CHAT_LOG) || "null"); }
    catch (e) { data = null; }
    if (!data || !Array.isArray(data.log) || !data.log.length) return;

    chatLog = data.log.slice(-MAX_CHAT_LOG).filter(function (item) {
      return item && typeof item.text === "string";
    });
    if (Array.isArray(data.history)) {
      data.history.slice(-MAX_AI_HISTORY).forEach(function (h) {
        if (h && typeof h.content === "string") aiHistory.push(h);
      });
    }
    chatLog.forEach(function (item) {
      renderAiMessage(item.cls, item.text, item.role, item.t);
    });
  }

  function clearChatLog() {
    const el = document.getElementById("ai-output");
    chatLog = [];
    aiHistory.length = 0;
    try { localStorage.removeItem(LS_CHAT_LOG); } catch (e) { /* ignore */ }
    el.querySelectorAll(".ai-message").forEach(function (n) { n.remove(); });
    if (aiEmptyNode && !document.getElementById("ai-chat-empty")) {
      el.insertBefore(aiEmptyNode, el.firstChild);
    }
  }

  function normalizeSettingsAction(action) {
    if (!action || typeof action !== "object" || !action.args || typeof action.args !== "object") return null;
    const args = action.args;
    const panel = args.panel;
    const validPanel = Object.prototype.hasOwnProperty.call(PANEL_LABELS, panel);
    if (action.type === "panel_visibility" && validPanel && typeof args.visible === "boolean") return { type: action.type, args: { panel: panel, visible: args.visible } };
    if (action.type === "panel_order" && exactPermutation(args.order, DEFAULT_UI_CONFIG.panelOrder)) return { type: action.type, args: { order: args.order.slice() } };
    if (action.type === "column_order" && validPanel && exactPermutation(args.order, DEFAULT_UI_CONFIG.columns[panel])) return { type: action.type, args: { panel: panel, order: args.order.slice() } };
    if (action.type === "panel_title" && validPanel && typeof args.title === "string" && args.title.trim() && args.title.trim().length <= 24) return { type: action.type, args: { panel: panel, title: args.title.trim() } };
    if (action.type === "panel_color" && validPanel && COLOR_VALUES[args.color]) return { type: action.type, args: { panel: panel, color: args.color } };
    if (action.type === "default_arena_sheet" && typeof args.sheet === "string" && args.sheet.trim().length <= 80) return { type: action.type, args: { sheet: args.sheet.trim() } };
    if (action.type === "row_limit" && validPanel && Number.isInteger(args.limit) && args.limit >= 0 && args.limit <= 200) return { type: action.type, args: { panel: panel, limit: args.limit } };
    if (action.type === "loan_add") {
      const name = String(args.name || "").trim();
      const day = Number(args.day);
      const principal = Number(args.principal);
      const monthlyAmount = Number(args.monthlyAmount);
      const received = Number(args.received);
      const phone = String(args.phone || "").trim();
      const notes = String(args.notes || "").trim();
      const firstPaymentDate = String(args.firstPaymentDate || "").trim();
      const prepaidMonths = Number(args.prepaidMonths);
      if (name && name.length <= 80 && Number.isInteger(day) && day >= 1 && day <= 31 && principal > 0 &&
          monthlyAmount >= 0 && received >= 0 && phone.length <= 40 && notes.length <= 300 &&
          /^\d{4}-\d{2}-\d{2}$/.test(firstPaymentDate) &&
          Number.isInteger(prepaidMonths) && prepaidMonths >= 0 && prepaidMonths <= 12) {
        return { type: action.type, args: { name: name, day: day, principal: principal, monthlyAmount: monthlyAmount, prepaidMonths: prepaidMonths, received: received, phone: phone, notes: notes, firstPaymentDate: firstPaymentDate } };
      }
    }
    if (action.type === "loan_edit") {
      const debtorId = String(args.debtorId || "").trim();
      const currentName = String(args.currentName || "").trim();
      const name = String(args.name || "").trim();
      const day = Number(args.day);
      const principal = Number(args.principal);
      const monthlyAmount = Number(args.monthlyAmount);
      const phone = String(args.phone || "").trim();
      const notes = String(args.notes || "").trim();
      const firstPaymentDate = String(args.firstPaymentDate || "").trim();
      if (debtorId && currentName && name && Number.isInteger(day) && day >= 1 && day <= 31 && principal >= 0 && monthlyAmount >= 0 &&
          phone.length <= 40 && notes.length <= 300 && (!firstPaymentDate || /^\d{4}-\d{2}-\d{2}$/.test(firstPaymentDate))) {
        return { type: action.type, args: { debtorId: debtorId, currentName: currentName, name: name, day: day, principal: principal, monthlyAmount: monthlyAmount, phone: phone, notes: notes, firstPaymentDate: firstPaymentDate } };
      }
    }
    if (action.type === "loan_payment") {
      const debtorId = String(args.debtorId || "").trim();
      const name = String(args.name || "").trim();
      const amount = Number(args.amount);
      const date = String(args.date || "").trim();
      const note = String(args.note || "").trim();
      if (debtorId && name && amount > 0 && (!date || /^\d{4}-\d{2}-\d{2}$/.test(date)) && note.length <= 300) {
        return { type: action.type, args: { debtorId: debtorId, name: name, amount: amount, date: date, note: note } };
      }
    }
    if (action.type === "loan_delete") {
      const debtorId = String(args.debtorId || "").trim();
      const name = String(args.name || "").trim();
      if (debtorId && name) return { type: action.type, args: { debtorId: debtorId, name: name } };
    }
    return null;
  }

            : "不預收（每期收）") +

      };

    if (action.type === "loan_edit") return {
      title: "編輯借款人「" + args.currentName + "」",

        "收款日：每月 " + args.day + " 日" +

    };

    };

  async function applyLoanAddAction(action) {
    const response = await fetch("/api/loan/add", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(action.args)
    });
    const data = await response.json().catch(function () { return {}; });
    if (!response.ok || data.ok === false) throw new Error(data.error || ("HTTP " + response.status));
    await loadLoan();
  }

  async function applyLoanWriteAction(action) {
    const endpoints = {
      loan_add: "/api/loan/add",
      loan_edit: "/api/loan/edit",
      loan_payment: "/api/loan/payment",
      loan_delete: "/api/loan/delete"
    };
    const endpoint = endpoints[action.type];
    if (!endpoint) throw new Error("不支援這項借貸操作。 ");
    const response = await fetch(endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(action.args)
    });
    const data = await response.json().catch(function () { return {}; });
    if (!response.ok || data.ok === false) throw new Error(data.error || ("HTTP " + response.status));
    await loadLoan();
  }

  function applySettingsAction(action) {
    const args = action.args;
    if (action.type === "panel_visibility") {
      if (!args.visible) {
        const othersVisible = Object.keys(uiConfig.panelVisibility).some(function (panel) { return panel !== args.panel && uiConfig.panelVisibility[panel]; });
        if (!othersVisible) throw new Error("至少要保留一個可見區塊。 ");
      }
      uiConfig.panelVisibility[args.panel] = args.visible;
    } else if (action.type === "panel_order") {
      uiConfig.panelOrder = args.order.slice();
    } else if (action.type === "column_order") {
      uiConfig.columns[args.panel] = args.order.slice();
    } else if (action.type === "panel_title") {
      uiConfig.titles[args.panel] = args.title;
    } else if (action.type === "panel_color") {
      uiConfig.colors[args.panel] = args.color;
    } else if (action.type === "default_arena_sheet") {
      if (args.sheet && state.arena.sheets.length && !state.arena.sheets.includes(args.sheet)) throw new Error("找不到這個小巨蛋週次，請重新選擇。 ");
      uiConfig.defaultArenaSheet = args.sheet;
    } else if (action.type === "row_limit") {
      uiConfig.rowLimits[args.panel] = args.limit;
    } else {
      throw new Error("不支援這項設定。 ");
    }
    uiConfig = normalizeUiConfig(uiConfig);
    saveUiConfig();
    applyUiConfig(true);
    if (action.type === "default_arena_sheet" && args.sheet && args.sheet !== state.arena.sheet) loadArena(args.sheet);
  }

    function finish(stateClass, label) {
      card.classList.add(stateClass);
      kicker.textContent = label;
      applyButton.disabled = true;
      cancelButton.disabled = true;
    }
    applyButton.addEventListener("click", async function () {
      applyButton.disabled = true;
      cancelButton.disabled = true;
      applyButton.textContent = isLoanAction ? loanLabel.busy : "套用中…";
      try {
        if (isLoanAction) {
          await applyLoanWriteAction(action);

        } else {
          applySettingsAction(action);

      }
    });
    cancelButton.addEventListener("click", function () {
      const cancelMessage = isLoanAction ? "操作已取消 · 未寫入" : "設定已取消 · 未套用";
      card.remove();
      pushAiResponse("info-line", cancelMessage);
      const input = document.getElementById("ai-dialog-input");
      if (input) input.focus();
      output.scrollTop = output.scrollHeight;
    });
    output.scrollTop = output.scrollHeight;
  }

  function dashboardForAI() {
    return {
      generatedAt: new Date().toISOString(),
      uiConfig: uiConfig,
      availableArenaSheets: state.arena.sheets || [],
      loan: {
        status: state.loan.status,
        today: todayYMD(),
        rows: (state.loan.rows || []).slice(0, 100).map(function (r) {
          const raw = r.raw || {};
          const covered = r.amount > 0 ? Math.floor(r.received / r.amount) : 0;
          const due = countPeriodsDueForDebtor(raw, todayYMD());
          return {
            id: r.id,
            name: r.name,
            day: r.day,
            principal: r.principal,
            monthlyAmount: r.amount,
            received: r.received,
            status: r.status,
            overdueDays: r.overdueDays,
            firstPaymentDate: normalizeDate(raw.firstPaymentDate) || "",
            prepaidMonths: Number(raw.prepaidMonths) || 0,
            nextDueDate: nextDueDateFor(raw),
            periodsCovered: covered,
            periodsDue: due,
            periodsOwed: Math.max(0, due - covered),
            phone: raw.phone ? String(raw.phone) : "",
            notes: raw.notes ? String(raw.notes) : "",
            payments: (Array.isArray(raw.payments) ? raw.payments : []).slice(-24).map(function (p) {
              return {
                date: normalizeDate(p.date) || String(p.date || ""),
                amount: (Number(p.principal) || 0) + (Number(p.interest) || 0),
                note: String(p.note || "")
              };
            })
          };
        })
      },
      petty: {
        status: state.petty.status,
        balance: state.petty.balance,
        records: (state.petty.records || []).slice(0, 100)
      },
      arena: {
        status: state.arena.status,
        sheet: state.arena.sheet,
        records: (state.arena.records || []).slice(0, 100)
      }
    };
  }

  async function askAI(raw) {
    const message = String(raw || "").trim();
    if (!message || aiBusy) return;

    openAiChat(true);
    pushAiResponse("", message, "user");
    setAiBusy(true);
    addLog("AI 對話：" + message);

    try {
      const response = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          message: message,
          history: aiHistory,
          dashboard: dashboardForAI()
        })
      });

      const data = await response.json().catch(function () { return {}; });
      if (!response.ok) {
        throw new Error(data.error || ("HTTP " + response.status));
      }

      const answer = String(data.answer || "AI 沒有回傳文字。");
      aiHistory.push({ role: "user", content: message });
      aiHistory.push({ role: "assistant", content: answer });
      if (aiHistory.length > MAX_AI_HISTORY) {
        aiHistory.splice(0, aiHistory.length - MAX_AI_HISTORY);
      }
      pushAiResponse("ok-line", answer);
      (Array.isArray(data.actions) ? data.actions : []).forEach(renderSettingsAction);
    } catch (e) {
      const detail = (e && e.message) || String(e);
      const hint = location.protocol === "file:"
        ? "請改用 start-boss-desk-ai.bat 開啟本機 AI 版。"
        : detail;
      pushAiResponse("err-line", "AI 連線失敗：" + hint);
    } finally {
      setAiBusy(false);
      document.getElementById("ai-dialog-input").focus();
    }
  }

  async function submitAiInput(input) {
    const value = input.value;
    if (!value.trim() || aiBusy) return;
    input.value = "";
    await askAI(value);
  }

  function helpText() {
    return [
      "本版為唯讀解析，不會寫回試算表。聽得懂的句型：",
      "  · 「阿明還我300」／「王小明還款 5000」→ 解析還款金額",
      "  · 「零用金扣80」／「零用金支 200」／「零用金入 500」→ 試算餘額",
      "  · 「查本週小巨蛋」／「本週小巨蛋」→ 週帳合計",
      "  · 「查阿明」／「阿明狀態」→ 該借款人摘要",
      "  · 「說明」／「help」→ 顯示此說明"
    ].join("\n");
  }

  function findDebtorByName(name) {
    const q = String(name).trim();
    if (!q) return null;
    const rows = state.loan.rows || [];
    let hit = rows.find(function (r) { return r.name === q; });
    if (hit) return hit;
    hit = rows.find(function (r) { return r.name.indexOf(q) >= 0; });
    if (hit) return hit;
    hit = rows.find(function (r) { return q.indexOf(r.name) >= 0; });
    return hit || null;
  }

  function parseCommand(raw) {
    const input = String(raw || "").trim();
    if (!input) return { type: "empty" };

    if (/^(說明|幫助|指令|help|\?)$/i.test(input)) {
      return { type: "help" };
    }

    if (/查?(本週)?小巨蛋|小巨蛋(本週|週帳|合計)?/.test(input) && /查|本週|合計|統計/.test(input) ||
        /^(查本週小巨蛋|本週小巨蛋|查小巨蛋)$/.test(input)) {
      return { type: "arena_week" };
    }
    if (/小巨蛋/.test(input) && /查|本週/.test(input)) {
      return { type: "arena_week" };
    }

    let m = input.match(/^零用金\s*(扣|支|支出|減|入|收|加|存)\s*([0-9,]+(?:\.\d+)?)\s*元?$/);
    if (m) {
      const verb = m[1];
      let amt = parseFloat(m[2].replace(/,/g, ""));
      const isIn = /入|收|加|存/.test(verb);
      if (!isIn) amt = -Math.abs(amt);
      else amt = Math.abs(amt);
      return { type: "petty", amount: amt, verb: verb };
    }
    m = input.match(/^零用金\s*([+-])\s*([0-9,]+(?:\.\d+)?)\s*元?$/);
    if (m) {
      let amt = parseFloat(m[2].replace(/,/g, ""));
      if (m[1] === "-") amt = -Math.abs(amt);
      else amt = Math.abs(amt);
      return { type: "petty", amount: amt };
    }

    m = input.match(/^查\s*(.+)$/);
    if (m) {
      const name = m[1].replace(/狀態$/, "").trim();
      if (name && !/本週|小巨蛋|零用金/.test(name)) {
        return { type: "lookup", name: name };
      }
    }
    m = input.match(/^(.+?)\s*狀態$/);
    if (m) {
      return { type: "lookup", name: m[1].trim() };
    }

    m = input.match(/^(.+?)\s*(?:還我|還款|還)\s*([0-9,]+(?:\.\d+)?)\s*元?$/);
    if (m) {
      return {
        type: "repay",
        name: m[1].trim(),
        amount: parseFloat(m[2].replace(/,/g, ""))
      };
    }

    return { type: "unknown", input: input };
  }

  function runCommand(raw) {
    const parsed = parseCommand(raw);
    addLog("指令：" + raw);

    if (parsed.type === "empty") {
      pushAiResponse("warn-line", "請輸入指令。");
      return;
    }

    if (parsed.type === "help") {
      pushAiResponse("info-line", helpText());
      return;
    }

    if (parsed.type === "repay") {
      const d = findDebtorByName(parsed.name);
      const nameShow = d ? d.name : parsed.name;
      let msg = "解析到 " + nameShow + " 還款 $" + formatMoney(parsed.amount) + "（試算，未寫回）";
      if (d) {
        const newRecv = d.received + parsed.amount;
        msg += "\n  目前已收 " + formatMoney(d.received) + " → 試算後 " + formatMoney(newRecv) +
          "｜本金 " + formatMoney(d.principal) + "｜月收 " + formatMoney(d.amount) +
          "｜狀態 " + d.status;
      } else if (state.loan.status === "ok") {
        msg += "\n  （名單中找不到「" + parsed.name + "」，僅解析金額）";
      } else if (state.loan.status === "error") {
        msg += "\n  （借貸資料未載入，無法比對姓名）";
      }
      pushAiResponse("ok-line", msg);
      return;
    }

    if (parsed.type === "petty") {
      if (state.petty.status !== "ok") {
        pushAiResponse("warn-line", "零用金資料未就緒（" + statusLabel(state.petty) + "），無法試算。解析金額：" +
          formatMoneySigned(parsed.amount));
        return;
      }
      const bal = Number(state.petty.balance) || 0;
      const next = bal + parsed.amount;
      const kind = parsed.amount < 0 ? "支出" : "收入";
      pushAiResponse("ok-line",
        "解析到零用金" + kind + " $" + formatMoney(Math.abs(parsed.amount)) +
        "（試算，未寫回）\n  目前餘額 " + formatMoney(bal) + " → 試算後 " + formatMoney(next));
      return;
    }

    if (parsed.type === "arena_week") {
      if (state.arena.status !== "ok") {
        pushAiResponse("warn-line", "小巨蛋資料未就緒（" + statusLabel(state.arena) + "）。");
        return;
      }
      const records = state.arena.records || [];
      let sumR = 0, sumRoll = 0;
      records.forEach(function (r) {
        if (r.result != null && r.result !== "" && !Number.isNaN(Number(r.result))) sumR += Number(r.result);
        if (r.rolling != null && r.rolling !== "" && !Number.isNaN(Number(r.rolling))) sumRoll += Number(r.rolling);
      });
      pushAiResponse("ok-line",
        "本週小巨蛋（" + (state.arena.sheet || "最新") + "）\n" +
        "  輸贏合計 " + formatMoneySigned(sumR) +
        "｜洗碼合計 " + formatMoney(sumRoll) +
        "｜筆數 " + records.length);
      return;
    }

    if (parsed.type === "lookup") {
      if (state.loan.status !== "ok") {
        pushAiResponse("warn-line", "借貸資料未就緒（" + statusLabel(state.loan) + "），無法查詢。");
        return;
      }
      const d = findDebtorByName(parsed.name);
      if (!d) {
        pushAiResponse("warn-line", "找不到借款人「" + parsed.name + "」。目前共 " +
          (state.loan.rows || []).length + " 人在表中。");
        return;
      }
      pushAiResponse("ok-line",
        d.name + " 狀態\n" +
        "  本金 " + formatMoney(d.principal) +
        "｜月收 " + formatMoney(d.amount) +
        "｜已收 " + formatMoney(d.received) +
        "｜收款日 每月 " + d.day + " 號" +
        "｜狀態 " + d.status);
      return;
    }

    pushAiResponse("err-line", "聽不懂「" + raw + "」。\n" + helpText());
  }

  function init() {
    fitDeskToViewport();
    window.addEventListener("resize", fitDeskToViewport);
    tickClock();
    setInterval(tickClock, 1000);

    loadQuickLoanDraft();
    renderLog();
    applyUiConfig(false);

    document.querySelectorAll("[data-ledger-tab]").forEach(function (button) {
      button.addEventListener("click", function () {
        switchLedgerPanel(button.dataset.ledgerTab);
      });
    });

    document.querySelectorAll("[data-collapse-panel]").forEach(function (button) {
      button.addEventListener("click", function () {
        toggleBottomPanel(button.dataset.collapsePanel);
      });
    });

    document.getElementById("quick-loan-form").addEventListener("input", function () {
      document.getElementById("quick-loan-error").textContent = "";
      saveQuickLoanDraft();
    });
    document.getElementById("quick-loan-form").addEventListener("submit", async function (event) {
      event.preventDefault();
      if (!aiBusy) await submitQuickLoan();
    });
    document.getElementById("quick-loan-clear").addEventListener("click", clearQuickLoanForm);
    document.querySelectorAll("[data-quick-loan-mode]").forEach(function (button) {
      button.addEventListener("click", function () {
        setQuickLoanMode(button.dataset.quickLoanMode);
      });
    });
    document.getElementById("quick-edit-borrower").addEventListener("change", function () {
      updateQuickEditValueHint(true);
    });
    document.getElementById("quick-edit-item").addEventListener("change", function () {
      updateQuickEditValueHint(true);
    });
    document.getElementById("quick-edit-value").addEventListener("input", function () {
      document.getElementById("quick-edit-error").textContent = "";
    });
    document.getElementById("quick-edit-form").addEventListener("submit", async function (event) {
      event.preventDefault();
      if (!aiBusy) await submitQuickEdit();
    });
    document.getElementById("quick-edit-clear").addEventListener("click", clearQuickEditForm);

    document.getElementById("petty-date-start").addEventListener("change", function () {
      pettyFilters.start = this.value;
      renderPetty();
    });
    document.getElementById("petty-date-end").addEventListener("change", function () {
      pettyFilters.end = this.value;
      renderPetty();
    });
    document.getElementById("petty-usage-filter").addEventListener("change", function () {
      pettyFilters.usage = this.value;
      renderPetty();
    });
    document.getElementById("petty-item-options").addEventListener("change", function (event) {
      const checkbox = event.target;
      if (!checkbox || checkbox.type !== "checkbox") return;
      if (checkbox.checked) pettyFilters.items.add(checkbox.value);
      else pettyFilters.items.delete(checkbox.value);
      renderPetty();
    });
    document.getElementById("petty-filter-clear").addEventListener("click", function () {
      pettyFilters.start = "";
      pettyFilters.end = "";
      pettyFilters.usage = "";
      pettyFilters.items.clear();
      document.getElementById("petty-date-start").value = "";
      document.getElementById("petty-date-end").value = "";
      document.getElementById("petty-usage-filter").value = "";
      document.getElementById("petty-item-filter").open = false;
      renderPetty();
    });

    document.getElementById("arena-date-start").addEventListener("change", function () {
      arenaFilters.start = this.value;
      renderArena();
    });
    document.getElementById("arena-date-end").addEventListener("change", function () {
      arenaFilters.end = this.value;
      renderArena();
    });
    document.getElementById("arena-result-filter").addEventListener("change", function () {
      arenaFilters.result = this.value;
      renderArena();
    });
    document.getElementById("arena-keyword").addEventListener("input", function () {
      arenaFilters.keyword = this.value;
      renderArena();
    });
    document.getElementById("arena-filter-clear").addEventListener("click", function () {
      arenaFilters.start = "";
      arenaFilters.end = "";
      arenaFilters.result = "";
      arenaFilters.keyword = "";
      document.getElementById("arena-date-start").value = "";
      document.getElementById("arena-date-end").value = "";
      document.getElementById("arena-result-filter").value = "";
      document.getElementById("arena-keyword").value = "";
      renderArena();
    });
    document.getElementById("arena-body").addEventListener("click", function (event) {
      const link = event.target.closest("a[data-arena-image]");
      if (!link) return;
      event.preventDefault();
      openArenaImage(link.dataset.arenaImage, link.dataset.arenaLabel);
    });
    document.getElementById("petty-body").addEventListener("click", function (event) {
      const link = event.target.closest("a[data-arena-image]");
      if (!link) return;
      event.preventDefault();
      openArenaImage(link.dataset.arenaImage, link.dataset.arenaLabel);
    });
    document.getElementById("arena-stats").addEventListener("click", function (event) {
      if (!event.target.closest("[data-arena-daily]")) return;
      openArenaDaily();
    });
    document.getElementById("arena-daily-close").addEventListener("click", closeArenaDaily);
    document.getElementById("arena-daily-lightbox").addEventListener("click", function (event) {
      if (event.target === this) closeArenaDaily();
    });

    document.getElementById("arena-image-close").addEventListener("click", closeArenaImage);
    document.getElementById("arena-image-lightbox").addEventListener("click", function (event) {
      if (event.target === this) closeArenaImage();
    });

    document.getElementById("btn-refresh").addEventListener("click", function () {
      refreshAll();
    });

    ["loan", "petty", "arena"].forEach(function (panel) {
      document.getElementById("refresh-" + panel).addEventListener("click", function () {
        refreshPanel(panel);
      });
    });

    document.getElementById("ai-chat-open").addEventListener("click", function () {
      openAiChat(true);
    });

    document.getElementById("ai-chat-close").addEventListener("click", closeAiChat);
    document.getElementById("ai-chat-backdrop").addEventListener("click", closeAiChat);

    // 到期／逾期列的「還款」鈕：帶出跟 AI 一樣的還款預覽卡，確認後才寫入
    const loanBody = document.getElementById("loan-body");
    loanBody.addEventListener("mouseover", function (event) {
      const target = event.target.closest("[data-loan-details-id]");
      if (target) showLoanHoverCard(target);
    });
    loanBody.addEventListener("mouseout", function (event) {
      const target = event.target.closest("[data-loan-details-id]");
      if (target && (!event.relatedTarget || !target.contains(event.relatedTarget))) hideLoanHoverCard();
    });
    loanBody.addEventListener("focusin", function (event) {
      const target = event.target.closest("[data-loan-details-id]");
      if (target) showLoanHoverCard(target);
    });
    loanBody.addEventListener("focusout", hideLoanHoverCard);
    loanBody.addEventListener("scroll", hideLoanHoverCard, { passive: true });

    loanBody.addEventListener("click", function (e) {
      const btn = e.target.closest(".row-pay-btn");
      if (!btn) return;
      openAiChat(false);
      renderSettingsAction({
        type: "loan_payment",
        args: {
          debtorId: btn.dataset.payId,
          name: btn.dataset.payName,
          amount: Number(btn.dataset.payAmount),
          date: todayYMD(),
          note: "工作台快速登記"
        }
      });
    });

    restoreChatLog();
    document.getElementById("ai-chat-clear").addEventListener("click", function () {
      if (!chatLog.length) return;
      if (!window.confirm("要清空對話簿嗎？共 " + chatLog.length + " 則訊息，清掉後 AI 也會忘記先前的上下文。")) return;
      clearChatLog();
      addLog("對話簿已清空");
    });

    chatPos = loadChatPos();
    if (chatPos) applyChatPos(chatPos);
    document.getElementById("ai-chat-head").addEventListener("pointerdown", startChatDrag);
    document.getElementById("ai-chat-head").addEventListener("dblclick", function (e) {
      if (e.target.closest("button, input, textarea, a")) return;
      resetChatPos();
      addLog("對話框位置已還原");
    });
    window.addEventListener("resize", function () {
      hideLoanHoverCard();
      applyChatPos(chatPos);
    });
    document.getElementById("ai-settings-reset").addEventListener("click", function () {
      if (!window.confirm("要把區塊顯示、順序、標題、顏色、預設週次、顯示筆數與欄位順序全部重設嗎？")) return;
      uiConfig = cloneDefaultUiConfig();
      saveUiConfig();
      applyUiConfig(true);
      addLog("工作台版面已重設");
      pushAiResponse("ok-line", "工作台顯示設定已恢復預設值；帳冊資料沒有被修改。 ");
    });

    document.addEventListener("keydown", function (e) {
      if (e.key !== "Escape") return;
      if (document.getElementById("arena-image-lightbox").classList.contains("is-open")) {
        closeArenaImage();
      } else if (document.getElementById("arena-daily-lightbox").classList.contains("is-open")) {
        closeArenaDaily();
      } else if (document.getElementById("ai-chat-shell").classList.contains("is-open")) {
        closeAiChat();
      }
    });

    document.getElementById("ai-dialog-submit").addEventListener("click", async function () {
      await submitAiInput(document.getElementById("ai-dialog-input"));
    });

    document.getElementById("ai-dialog-input").addEventListener("keydown", function (e) {
      if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        document.getElementById("ai-dialog-submit").click();
      }
    });

    document.getElementById("arena-sheet-select").addEventListener("change", function () {
      const v = this.value;
      if (v) {
        addLog("切換小巨蛋週次：" + v);
        loadArena(v);
      }
    });

    loadLoan();
    loadPetty();
    loadArena(uiConfig.defaultArenaSheet || undefined);
    loadStrategyE();
    setInterval(loadStrategyE, 60000);
    document.addEventListener("visibilitychange", function () {
      if (!document.hidden) loadStrategyE();
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
