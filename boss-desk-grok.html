<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>營運工作台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* Proportions aligned to boss-viewer.html (type / table density) */
  :root {
    --void: #0a0806;
    --ink: #0a0806;
    --panel: #14110c;
    --panel-2: #1c1812;
    --hover: #1c1812;
    --input: #0a0806;

    --cream: #f5e9c8;
    --cream-soft: #a89878;
    --muted: #a89878;
    --dim: #6b5f48;

    --gold: #d4af37;
    --gold-hi: #f4cf5c;
    --gold-lo: #6b5f48;
    --brass: #d4af37;

    --ok: #7fb069;
    --ok-soft: rgba(127, 176, 105, 0.12);
    --warn: #e08a3c;
    --warn-soft: rgba(224, 138, 60, 0.12);
    --danger: #c03a2b;
    --danger-soft: rgba(192, 58, 43, 0.12);
    --info: #d4af37;
    --info-soft: rgba(212, 175, 55, 0.1);
    --ai: #d4af37;

    --loan: #d4af37;
    --petty: #7fb069;
    --arena: #e08a3c;
    --lifan: #6d9fc4;
    --lifan-hi: #91c8ed;
    --lifan-soft: rgba(109, 159, 196, 0.12);

    --line: #3a3025;
    --line-soft: rgba(58, 48, 37, 0.65);
    --line-strong: rgba(212, 175, 55, 0.35);
    --line-gold: rgba(212, 175, 55, 0.25);

    --radius: 0;
    --radius-sm: 0;

    --font-display: "Noto Serif TC", "Microsoft JhengHei", serif;
    --font-ui: "Noto Serif TC", "Microsoft JhengHei", serif;
    --font-mono: "Noto Serif TC", "Microsoft JhengHei", serif;

    --header-h: 58px;
    --ai-bar-h: 52px;
    --ai-resp-h: 100px;
    --bottom-h: 48px;
    --gap: 12px;
    --panel-gap: 24px;

    --shadow-desk: none;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--void);
    color: var(--cream);
    font-family: var(--font-ui);
    font-size: 16px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  body {
    position: relative;
    background: var(--void);
  }

  #desk-canvas {
    width: 2560px;
    height: 910px;
    display: grid;
    grid-template-rows: minmax(0, 1fr);
    gap: var(--gap);
    padding: 14px 16px;
    position: absolute;
    left: 0;
    top: 0;
    zoom: 1;
    background:
      radial-gradient(ellipse at top, rgba(212, 175, 55, 0.08), transparent 60%),
      var(--void);
  }

  body::before, body::after { display: none; }

  #desk-canvas > * { position: relative; z-index: 1; }

  .surface {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow-desk);
    position: relative;
  }

  .surface.ledger-corners::before,
  .surface.ledger-corners::after {
    content: "";
    position: absolute;
    width: 12px;
    height: 12px;
    pointer-events: none;
    z-index: 4;
  }
  .surface.ledger-corners::before {
    top: 6px; left: 6px;
    border-top: 1px solid rgba(212, 175, 55, 0.45);
    border-left: 1px solid rgba(212, 175, 55, 0.45);
  }
  .surface.ledger-corners::after {
    bottom: 6px; right: 6px;
    border-bottom: 1px solid rgba(212, 175, 55, 0.35);
    border-right: 1px solid rgba(212, 175, 55, 0.35);
  }

  /* ── Header ── */
  .header {
    display: grid;
    grid-template-columns: auto auto auto minmax(0, 1fr);
    align-items: center;
    gap: 12px;
    padding: 0;
    overflow: hidden;
    background: transparent;
    border: 0;
    border-radius: 0;
    box-shadow: none;
    position: absolute !important;
    left: 16px;
    top: 14px;
    width: calc((100% - 80px) / 3);
    height: var(--header-h);
    z-index: 80 !important;
  }


  .clock-block {
    display: flex;
    align-items: baseline;
    gap: 14px;
    justify-content: flex-start;
  }

  .clock-time {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.06em;
    color: var(--gold-hi);
    font-variant-numeric: tabular-nums;
  }

  .clock-date {
    font-size: 15px;
    color: var(--muted);
    white-space: nowrap;
    letter-spacing: 0.04em;
  }

  .weather-block {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    background: var(--panel);
    border: 1px solid var(--line);
  }

  .weather-icon { font-size: 20px; line-height: 1; }

  .weather-temp {
    font-size: 20px;
    font-weight: 700;
    color: var(--gold);
    font-variant-numeric: tabular-nums;
  }

  .weather-desc {
    font-size: 15px;
    color: var(--muted);
    letter-spacing: 0.04em;
  }

  .weather-loading, .weather-error {
    font-size: 15px;
    color: var(--dim);
  }

  .apps {
    display: flex;
    align-items: center;
    gap: 8px;
    justify-self: end;
  }

  .panel-tool {
    height: 36px;
    padding: 0 13px;
    border: 1px solid color-mix(in srgb, var(--panel-accent) 42%, transparent);
    background: transparent;
    color: var(--muted);
    font: 700 13px/1 var(--font-ui);
    letter-spacing: .06em;
    white-space: nowrap;
    cursor: pointer;
  }

  .panel-tool:hover,
  .panel-tool[aria-expanded="true"] {
    color: var(--gold-hi);
    border-color: var(--gold);
    background: rgba(212, 175, 55, .11);
  }

  .app-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 10px 16px;
    background: var(--panel);
    border: 1px solid var(--line-gold);
    color: var(--muted);
    font-family: inherit;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.04em;
    text-decoration: none;
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
    white-space: nowrap;
  }

  .app-btn:hover {
    border-color: var(--gold);
    color: var(--gold);
    background: var(--panel-2);
  }

  .app-btn:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 2px;
  }

  .app-btn:active { transform: translateY(1px); }

  .app-btn.refresh {
    border-color: var(--gold);
    color: var(--gold-hi);
    background: rgba(212, 175, 55, 0.14);
  }

  .app-btn.refresh:hover {
    border-color: var(--gold-hi);
    color: var(--gold-hi);
    background: rgba(212, 175, 55, 0.22);
  }

  .app-btn.refresh.spinning svg { animation: spin 0.8s linear infinite; }

  @keyframes spin { to { transform: rotate(360deg); } }

  @keyframes pulse-dot {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.55; }
  }

  .app-btn svg { width: 15px; height: 15px; flex-shrink: 0; }

  .app-btn.messaging {
    color: var(--text);
  }

  .app-btn.messaging svg {
    width: 18px;
    height: 18px;
  }

  .app-btn.messaging:hover {
    color: var(--gold-hi);
  }

  /* ── AI Command Bar (inside header, after weather) ── */
  .ai-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
    height: 40px;
    padding: 0 0 0 12px;
    margin: 0;
    overflow: hidden;
    background: transparent;
    border: none;
    box-shadow: none;
    border-left: 1px solid var(--line);
  }

  .ai-bar::before { display: none; }

  .ai-label {
    position: relative;
    isolation: isolate;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    height: 36px;
    font-size: 15px;
    font-weight: 700;
    color: var(--gold-hi);
    white-space: nowrap;
    letter-spacing: 0.06em;
    padding: 0 13px;
    flex-shrink: 0;
    overflow: hidden;
    background: #0d0b07;
    border: 1px solid rgba(255, 220, 92, 0.7);
    font-family: inherit;
    cursor: pointer;
    box-shadow: 0 0 8px rgba(212, 175, 55, 0.18), inset 0 0 12px rgba(212, 175, 55, 0.07);
    transition: color 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease;
  }

  .ai-label::before {
    content: "";
    position: absolute;
    z-index: -2;
    width: 190%;
    aspect-ratio: 1;
    background: conic-gradient(
      from 0deg,
      transparent 0 12%,
      rgba(255, 246, 181, 0.95) 15%,
      var(--gold-hi) 18%,
      transparent 23% 46%,
      rgba(212, 175, 55, 0.9) 51%,
      transparent 56% 76%,
      #fff6b5 82%,
      transparent 87%
    );
    animation: electric-border-spin 2.7s linear infinite;
  }

  .ai-label::after {
    content: "";
    position: absolute;
    z-index: -1;
    inset: 2px;
    background: linear-gradient(100deg, #0b0905, #171207 52%, #0b0905);
  }

  .ai-label:hover {
    color: #fff8c9;
    transform: translateY(-1px);
    box-shadow: 0 0 15px rgba(255, 218, 76, 0.52), inset 0 0 14px rgba(212, 175, 55, 0.15);
  }

  .ai-label:active { transform: translateY(0) scale(0.98); }

  .ai-label:focus-visible {
    outline: 2px solid #fff3a3;
    outline-offset: 3px;
  }

  .ai-label svg {
    width: 20px;
    height: 20px;
    filter: drop-shadow(0 0 4px rgba(255, 223, 94, 0.72));
  }

  @keyframes electric-border-spin { to { transform: rotate(360deg); } }

  .ai-prompt {
    font-size: 18px;
    font-weight: 700;
    color: var(--gold);
    flex-shrink: 0;
  }

  .ai-input {
    flex: 1;
    min-width: 0;
    height: 36px;
    padding: 0 12px;
    background: var(--input);
    border: 1px solid var(--line);
    color: var(--cream);
    font-family: inherit;
    font-size: 15px;
    outline: none;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  .ai-input::placeholder {
    color: var(--dim);
    letter-spacing: 0.02em;
  }

  .ai-input:focus {
    border-color: var(--gold);
    background: #100e0a;
  }

  .ai-submit {
    height: 36px;
    padding: 0 14px;
    flex-shrink: 0;
    background: rgba(212, 175, 55, 0.14);
    border: 1px solid var(--gold);
    color: var(--gold-hi);
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.08em;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }

  .ai-submit:hover {
    background: rgba(212, 175, 55, 0.22);
    border-color: var(--gold-hi);
    color: var(--gold-hi);
  }
  .ai-submit:active { transform: scale(0.98); }
  .ai-submit:disabled {
    opacity: 0.5;
    cursor: wait;
  }
  .ai-submit:focus-visible {
    outline: 2px solid var(--gold-hi);
    outline-offset: 2px;
  }

  /* ── Three Tables ── */
  .tables {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: var(--panel-gap);
    min-height: 0;
  }

  .ledger-switcher {
    grid-column: 1;
    min-width: 0;
    min-height: 0;
    display: grid;
    grid-template-rows: 46px minmax(0, 1fr) 100px;
    gap: 10px 0;
    padding-top: var(--header-h);
  }

  .ledger-tabs {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    border: 1px solid var(--line);
    border-bottom: 0;
    background: #0e0c08;
  }

  .ledger-tab {
    min-width: 0;
    border: 0;
    border-right: 1px solid var(--line);
    background: transparent;
    color: var(--muted);
    font: 700 15px/1 var(--font-ui);
    letter-spacing: .06em;
    cursor: pointer;
  }

  .ledger-tab:last-child { border-right: 0; }
  .ledger-tab:hover { color: var(--gold-hi); background: rgba(212, 175, 55, .06); }
  .ledger-tab.is-active {
    color: var(--gold-hi);
    background: rgba(212, 175, 55, .14);
    box-shadow: inset 0 -2px 0 var(--gold);
  }
  .ledger-tab:focus-visible { outline: 1px solid var(--cream); outline-offset: -4px; }

  .ledger-switcher > .panel {
    grid-row: 2;
    border-top: 0;
  }

  .strategy-card {
    grid-row: 3;
    min-width: 0;
    height: 100px;
    overflow: hidden;
    border-color: rgba(212, 175, 55, .42);
    background:
      linear-gradient(90deg, rgba(212, 175, 55, .075), transparent 38%),
      #0f0d09;
  }

  .strategy-card::before {
    content: "";
    position: absolute;
    inset: 0 auto 0 0;
    width: 3px;
    background: var(--gold);
  }

  .strategy-card-head {
    position: absolute;
    top: -1px;
    left: 18px;
    z-index: 2;
    padding: 0 10px 0 8px;
    background: #0f0d09;
    color: var(--gold-hi);
    font: 700 11px/20px var(--font-display);
    letter-spacing: .28em;
  }

  .strategy-rows {
    height: 100%;
    display: grid;
    grid-template-rows: repeat(2, 1fr);
    padding: 16px 14px 4px;
  }

  .strategy-row {
    min-width: 0;
    display: grid;
    grid-template-columns: 72px 174px minmax(0, 1fr) 190px;
    align-items: center;
    column-gap: 20px;
    padding: 0 14px;
    border-bottom: 1px solid rgba(212, 175, 55, .13);
    white-space: nowrap;
  }

  .strategy-row:last-child { border-bottom: 0; }
  .strategy-game { color: var(--gold-hi); font-size: 17px; font-weight: 800; letter-spacing: .06em; }
  .strategy-date { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .strategy-current {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--cream);
    font-size: 15px;
    font-weight: 650;
    font-variant-numeric: tabular-nums;
  }
  .strategy-next { color: var(--muted); font-size: 13px; text-align: right; }
  .strategy-heads {
    margin-left: 5px;
    color: #ffe39a;
    font-size: 17px;
    font-weight: 800;
    letter-spacing: .04em;
    text-shadow: 0 0 10px rgba(255, 211, 105, .22);
  }
  .strategy-row.is-empty .strategy-date,
  .strategy-row.is-empty .strategy-current,
  .strategy-row.is-empty .strategy-next { color: var(--dim); }

  .payroll-panel {
    --panel-accent: var(--gold-hi);
    grid-column: 2 / 4;
  }

  .payroll-panel::before { display: none; }

  .payroll-frame-wrap {
    flex: 1;
    min-height: 0;
    overflow: hidden;
    background: #050907;
    position: relative;
  }

  .payroll-frame {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
    background: #050907;
  }

  .payroll-open-link,
  .utility-close {
    min-width: 34px;
    height: 34px;
    display: inline-grid;
    place-items: center;
    padding: 0 12px;
    border: 1px solid color-mix(in srgb, var(--panel-accent) 55%, transparent);
    background: transparent;
    color: var(--panel-accent);
    font: 700 13px/1 var(--font-ui);
    letter-spacing: .08em;
    text-decoration: none;
    cursor: pointer;
  }

  .payroll-panel > .payroll-open-link {
    position: absolute;
    top: 12px;
    right: 14px;
    z-index: 8;
    background: rgba(5, 9, 7, .88);
    backdrop-filter: blur(5px);
  }

  .payroll-open-link:hover,
  .utility-close:hover { background: rgba(212, 175, 55, .12); border-color: currentColor; }

  .utility-launch {
    color: var(--cream);
    border-color: rgba(212, 175, 55, .42);
  }

  .utility-launch:hover,
  .utility-launch[aria-expanded="true"] {
    color: var(--gold-hi);
    border-color: var(--gold);
    background: rgba(212, 175, 55, .13);
  }

  .utility-backdrop {
    position: absolute !important;
    inset: 0;
    z-index: 90 !important;
    background: rgba(0, 0, 0, .72);
    backdrop-filter: blur(3px);
  }

  .utility-panel.is-utility-open {
    display: flex !important;
    position: absolute;
    inset: 28px 160px;
    z-index: 91;
    border-color: var(--panel-accent);
    box-shadow: 0 28px 80px rgba(0, 0, 0, .72);
  }

  .panel {
    --panel-accent: var(--gold);
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
  }

  .panel::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    z-index: 3;
    background: var(--panel-accent);
  }
  .panel[hidden] { display: none; }

  .panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 18px;
    flex-shrink: 0;
    border-bottom: 1px solid var(--line-gold);
    background: transparent;
    position: relative;
  }

  .panel-head::after { display: none; }

  .panel-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--panel-accent);
  }

  .panel-title .badge {
    width: 8px;
    height: 8px;
    border-radius: 0;
    box-shadow: none;
    transform: none;
    flex-shrink: 0;
  }

  .panel-title .badge { background: var(--panel-accent); color: var(--panel-accent); }

  .panel-title .eyebrow {
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.08em;
    color: var(--dim);
    margin-right: 2px;
  }

  .panel-stats {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  .panel-head-actions {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
    min-width: 0;
  }

  .panel-refresh {
    width: 36px;
    height: 36px;
    display: grid;
    place-items: center;
    flex: 0 0 36px;
    padding: 0;
    border: 1px solid color-mix(in srgb, var(--panel-accent) 55%, transparent);
    background: var(--void);
    color: var(--panel-accent);
    cursor: pointer;
  }

  .panel-refresh:hover { background: color-mix(in srgb, var(--panel-accent) 10%, transparent); border-color: var(--panel-accent); }
  .panel-refresh:focus-visible { outline: 2px solid var(--panel-accent); outline-offset: 2px; }
  .panel-refresh:disabled { opacity: 0.5; cursor: wait; }
  .panel-refresh svg { width: 16px; height: 16px; }
  .panel-refresh.spinning svg { animation: spin 0.8s linear infinite; }

  .loan-kpis {
    display: block;
    min-height: 112px;
    flex: 0 0 auto;
    border-bottom: 1px solid var(--line);
    background: var(--void);
  }

  .loan-kpi-group {
    display: grid;
    grid-template-columns: 96px repeat(4, minmax(0, 1fr));
    min-height: 56px;
    border-bottom: 1px solid rgba(212, 175, 55, .13);
  }

  .loan-kpi-group:last-child { border-bottom: 0; }

  .loan-kpi-group-name {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 4px;
    padding: 7px 9px 7px 12px;
    border-left: 3px solid var(--gold);
    background: rgba(212, 175, 55, .055);
  }

  .loan-kpi-group-name strong {
    color: var(--gold-hi);
    font-size: 13px;
    letter-spacing: .08em;
    white-space: nowrap;
  }

  .loan-kpi-group-name span {
    color: var(--dim);
    font-size: 11px;
    white-space: nowrap;
  }

  .loan-kpi-group.is-lifan .loan-kpi-group-name {
    border-left-color: var(--lifan);
    background: var(--lifan-soft);
  }

  .loan-kpi-group.is-lifan .loan-kpi-group-name strong { color: var(--lifan-hi); }
  .loan-kpi-group.is-lifan .loan-kpi-value { color: var(--lifan-hi); }

  .loan-kpi {
    min-width: 0;
    padding: 8px 6px 7px;
    background: var(--panel);
    text-align: center;
  }
  .loan-kpi-label {
    display: block;
    color: var(--dim);
    font-size: 11px;
    letter-spacing: 0.04em;
    white-space: nowrap;
  }
  .loan-kpi-value {
    display: block;
    margin-top: 4px;
    color: var(--gold-hi);
    font-size: 18px;
    font-weight: 700;
    line-height: 1.05;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .loan-kpi.is-error { grid-column: 1 / -1; }
  .loan-kpi.is-error .loan-kpi-value { color: var(--danger); }

  .loan-ledger-group-row td {
    padding: 7px 12px !important;
    background: rgba(212, 175, 55, .055);
    border-top: 1px solid var(--line-gold);
    border-bottom: 1px solid rgba(212, 175, 55, .16);
    color: var(--gold-hi);
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .1em;
  }

  .panel-body {

  .ai-chat-shell {
    position: fixed;
    inset: 0;
    z-index: 100;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 0.2s ease, visibility 0.2s ease;
  }

  .ai-chat-shell.is-open {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
  }

  .ai-chat-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(4, 3, 2, 0.72);
  }

  .ai-chat-panel {
    position: absolute;
    top: 14px;
    right: 16px;
    bottom: 14px;
    width: min(680px, calc(100vw - 32px));
    display: grid;
    grid-template-rows: auto 1fr auto;
    overflow: hidden;
    background: var(--panel);
    border: 1px solid var(--line-strong);

  .ai-chat-panel.is-dragged {

    transition: none;

  .ai-chat-panel::before {

  .ai-chat-note {
    margin-top: 8px;
    color: var(--dim);
    font-size: 11px;
    letter-spacing: 0.04em;
  }

  .ai-chat-messages::-webkit-scrollbar { width: 8px; }
  .ai-chat-messages::-webkit-scrollbar-thumb { background: rgba(212, 175, 55, 0.22); }

  @media (max-width: 760px) {
    .ai-chat-panel,
    .ai-chat-panel.is-dragged { inset: 0; width: 100%; height: auto; }
    .ai-chat-head { min-height: 64px; cursor: default; }
    .ai-message { width: 94%; }
  }

  /* ── Bottom ── */
  .bottom {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--gap);
    min-height: 0;
    position: absolute !important;
    left: 16px;
    width: 760px;
    bottom: 14px;
    height: 48px;
    z-index: 70 !important;
    pointer-events: none;
  }

  .bottom:not(:has(.is-open)) { display: none; }

  .bottom:has(.is-open) {
    width: auto;
    right: 16px;
    height: 156px;
    grid-template-columns: 1fr;
  }
  .bottom:has(.is-open) > :not(.is-open) { display: none; }
  .bottom > * { pointer-events: auto; box-shadow: 0 -12px 30px rgba(0, 0, 0, .42); }

  .notes-panel:not(.is-open) .quick-loan-form,
  .notes-panel:not(.is-open) .quick-loan-modes,
  .log-panel:not(.is-open) .log-list { display: none !important; }

  .collapse-toggle {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    border: 0;
    background: transparent;
    color: var(--gold);
    font: inherit;
    letter-spacing: inherit;
    cursor: pointer;
  }

  .collapse-toggle::before {
    content: "+";
    width: 20px;
    height: 20px;
    display: grid;
    place-items: center;
    border: 1px solid rgba(212, 175, 55, .45);
    color: var(--gold-hi);
    font: 700 15px/1 var(--font-mono);
  }

  .is-open .collapse-toggle::before { content: "−"; }
  .collapse-toggle:hover { color: var(--gold-hi); }
  .collapse-toggle:focus-visible { outline: 1px solid var(--cream); outline-offset: 4px; }

  .notes-panel, .log-panel {
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
  }

  .sub-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    border-bottom: 1px solid var(--line-gold);
    font-size: 16px;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 0.08em;
    flex-shrink: 0;
    background: transparent;
  }

  .sub-head .hint {
    font-weight: 400;
    color: var(--dim);
    font-size: 13px;
    letter-spacing: 0.06em;
  }

  .quick-loan-form {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: 1.35fr 1fr 1fr .72fr 1.35fr .72fr auto auto;
    align-items: end;
    gap: 10px;
    padding: 11px 14px 13px;
  }

  .quick-loan-form[hidden] { display: none; }

  .quick-loan-edit-form {
    grid-template-columns: 1.7fr 1.25fr 1.35fr auto auto;
  }

  .quick-loan-modes {
    display: inline-flex;
    align-items: center;
    border: 1px solid var(--line-gold);
  }

  .quick-loan-mode {
    min-width: 112px;
    height: 34px;
    padding: 0 18px;
    border: 0;
    border-right: 1px solid var(--line-gold);
    background: transparent;
    color: var(--cream);
    font: 800 14px/1 inherit;
    letter-spacing: .08em;
    cursor: pointer;
  }

  .quick-loan-mode:last-child { border-right: 0; }
  .quick-loan-mode:hover { background: rgba(212, 175, 55, .09); color: var(--gold-bright); }
  .quick-loan-mode.is-active {
    background: rgba(212, 175, 55, .22);
    color: var(--gold-bright);
    box-shadow: inset 0 -2px 0 var(--gold);
  }
  .quick-loan-mode:focus-visible { outline: 1px solid var(--cream); outline-offset: 2px; }

  .quick-loan-field {
    min-width: 0;
    display: grid;
    gap: 5px;
  }

  .quick-loan-field > span {
    color: var(--dim);
    font-size: 11px;
    letter-spacing: .08em;
    white-space: nowrap;
  }

  .quick-loan-input-wrap {
    height: 34px;
    display: flex;
    align-items: center;
    border: 1px solid var(--line-gold);
    background: rgba(212, 175, 55, .025);
  }

  .quick-loan-input-wrap:focus-within {
    border-color: var(--gold);
    background: rgba(212, 175, 55, .055);
  }

  .quick-loan-input {
    width: 100%;
    min-width: 0;
    height: 32px;
    padding: 0 9px;
    border: 0;
    outline: 0;
    background: transparent;
    color: var(--cream);
    font: 600 14px/1 inherit;
  }

  .quick-loan-input[type="date"] { color-scheme: dark; }
  select.quick-loan-input { appearance: auto; cursor: pointer; }
  select.quick-loan-input option { background: #15130f; color: var(--cream); }

  .quick-loan-edit-form select.quick-loan-input,
  .quick-loan-edit-form select.quick-loan-input option {
    font-size: 18px;
    font-weight: 700;
    line-height: 1.35;
  }
  .quick-loan-input::placeholder { color: rgba(190, 178, 139, .46); }

  .quick-loan-unit {
    padding-right: 8px;
    color: var(--gold);
    font-size: 12px;
    white-space: nowrap;
  }

  .quick-loan-submit {
    height: 34px;
    min-width: 108px;
    padding: 0 15px;
    border: 1px solid var(--gold);
    background: rgba(212, 175, 55, .11);
    color: var(--gold-bright);
    font: 700 13px/1 inherit;
    letter-spacing: .08em;
    cursor: pointer;
  }

  .quick-loan-submit:hover { background: rgba(212, 175, 55, .2); }
  .quick-loan-submit:focus-visible { outline: 1px solid var(--cream); outline-offset: 2px; }
  .quick-loan-submit:disabled { opacity: .45; cursor: wait; }

  .quick-loan-clear {
    height: 34px;
    min-width: 62px;
    padding: 0 12px;
    border: 1px solid var(--danger);
    background: rgba(210, 70, 55, .1);
    color: #ff796c;
    font: 700 12px/1 inherit;
    letter-spacing: .08em;
    cursor: pointer;
  }

  .quick-loan-clear:hover { color: #fff0ed; border-color: #ff796c; background: rgba(210, 70, 55, .2); }
  .quick-loan-clear:focus-visible { outline: 1px solid var(--cream); outline-offset: 2px; }

  .quick-loan-error {
    grid-column: 1 / -1;
    min-height: 14px;
    margin-top: -3px;
    color: #ef796d;
    font-size: 11px;
    line-height: 1;
  }

  .log-list {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 4px 0;
  }

  .log-list::-webkit-scrollbar { width: 8px; }
  .log-list::-webkit-scrollbar-thumb {
    background: rgba(212, 175, 55, 0.22);
  }

  .log-item {
    display: grid;
    grid-template-columns: 84px 1fr;
    gap: 12px;
    padding: 10px 18px;
    font-size: 15px;
    border-left: 2px solid transparent;
    transition: background 0.12s ease, border-color 0.12s ease;
  }

  .log-item:hover {
    background: var(--panel-2);
    border-left-color: var(--gold);
  }

  .log-time {
    color: var(--dim);
    font-variant-numeric: tabular-nums;
    font-size: 14px;
  }

  .log-text {
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .log-empty {
    padding: 32px;
    text-align: center;
    color: var(--dim);
    font-size: 16px;
    letter-spacing: 0.04em;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>
<main id="desk-canvas">

<header class="header surface">
  <div class="clock-block">
    <span class="clock-time" id="clock-time">--:--:--</span>
    <span class="clock-date" id="clock-date">----/--/-- · --</span>
  </div>
  <div class="ai-bar" id="ai-bar">
    <button type="button" class="ai-label" id="ai-chat-open" title="開啟智慧助理" aria-label="開啟智慧助理對話" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M5 6.5h9.5A3.5 3.5 0 0 1 18 10v2.5a3.5 3.5 0 0 1-3.5 3.5H10l-4 3v-3.2A3.5 3.5 0 0 1 2.5 12.3V10A3.5 3.5 0 0 1 5 6.5Z"/>
        <path fill="currentColor" d="m18.7 3 .55 1.45L20.7 5l-1.45.55L18.7 7l-.55-1.45L16.7 5l1.45-.55L18.7 3Zm2.1 5 .35.85.85.35-.85.35-.35.85-.35-.85-.85-.35.85-.35.35-.85Z"/>
      </svg>
      <span>AI</span>
    </button>
  </div>
  <nav class="apps">
    <button type="button" class="app-btn refresh" id="btn-refresh" title="重新整理三張表">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      重新整理
    </button>
  </nav>
</header>


<section class="tables" id="dashboard-tables">
  <div class="ledger-switcher" id="ledger-switcher">
    <nav class="ledger-tabs" aria-label="帳冊分頁">
      <button type="button" class="ledger-tab is-active" data-ledger-tab="loan" aria-selected="true">借貸</button>
      <button type="button" class="ledger-tab" data-ledger-tab="petty" aria-selected="false">零用金</button>
      <button type="button" class="ledger-tab" data-ledger-tab="arena" aria-selected="false">小巨蛋週帳</button>
    </nav>
  <div class="panel surface ledger-corners" id="panel-loan" data-panel="loan">
    <div class="panel-head">
      <div class="panel-title">
        <span class="badge loan"></span>
        <span class="eyebrow">01</span><span id="panel-title-loan">借貸</span>
      </div>
      <div class="panel-head-actions">
        <button type="button" class="panel-tool" data-collapse-panel="quick-loan-section" aria-expanded="false">快速操作</button>
        <button type="button" class="panel-tool" data-collapse-panel="recent-log-section" aria-expanded="false">指令紀錄</button>
        <button type="button" class="panel-refresh" id="refresh-loan" title="只重新整理借貸" aria-label="只重新整理借貸">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.13-9.36L23 10"/></svg>
        </button>
      </div>
    </div>
    <div class="loan-kpis" id="loan-stats" aria-label="借貸總覽"></div>
    <div class="panel-body" id="loan-body">
      <div class="state-msg"><div class="spinner"></div>載入帳冊…</div>
    </div>
  </div>

  <div class="panel surface ledger-corners" id="panel-petty" data-panel="petty">
    <div class="panel-head">
      <div class="panel-title">
        <span class="badge petty"></span>
        <span class="eyebrow">02</span><span id="panel-title-petty">零用金</span>
      </div>
      <div class="panel-head-actions">
        <div class="panel-stats" id="petty-stats"></div>
        <button type="button" class="panel-refresh" id="refresh-petty" title="只重新整理零用金" aria-label="只重新整理零用金">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.13-9.36L23 10"/></svg>
        </button>
      </div>
    </div>
    <div class="petty-filters" id="petty-filters" aria-label="零用金查詢條件">
      <label class="filter-label" for="petty-date-start">日期</label>
      <input class="filter-input" type="date" id="petty-date-start" aria-label="起始日期">
      <span class="filter-label">到</span>
      <input class="filter-input" type="date" id="petty-date-end" aria-label="結束日期">
      <select class="filter-input" id="petty-usage-filter" aria-label="用途分類">
        <option value="">用途</option>
        <option value="公司">公司</option>
        <option value="家用">家用</option>
      </select>
      <details class="multi-filter" id="petty-item-filter">
        <summary id="petty-item-summary">項目：全部</summary>
        <div class="multi-filter-options" id="petty-item-options"></div>
      </details>
      <button type="button" class="filter-clear" id="petty-filter-clear">清除</button>
    </div>
    <div class="panel-body" id="petty-body">
      <div class="state-msg"><div class="spinner"></div>載入帳冊…</div>
    </div>
  </div>

  <div class="panel surface ledger-corners" id="panel-arena" data-panel="arena">
    <div class="panel-head">
      <div class="panel-title">
        <span class="badge arena"></span>
        <span class="eyebrow">03</span><span id="panel-title-arena">小巨蛋週帳</span>
      </div>
      <div class="panel-head-actions">
        <div class="panel-stats" id="arena-stats">
          <select class="sheet-select" id="arena-sheet-select" title="選擇週次" disabled>
            <option value="">—</option>
          </select>
        </div>
        <button type="button" class="panel-refresh" id="refresh-arena" title="只重新整理小巨蛋週帳" aria-label="只重新整理小巨蛋週帳">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.13-9.36L23 10"/></svg>
        </button>
      </div>
    </div>
    <div class="arena-filters" id="arena-filters" aria-label="小巨蛋查詢條件">
      <label class="filter-label" for="arena-date-start">日期</label>
      <input class="filter-input" type="date" id="arena-date-start" aria-label="小巨蛋起始日期">
      <span class="filter-label">到</span>
      <input class="filter-input" type="date" id="arena-date-end" aria-label="小巨蛋結束日期">
      <select class="filter-input arena-filter-select" id="arena-result-filter" aria-label="輸贏">
        <option value="">輸贏：全部</option>
        <option value="win">只看贏</option>
        <option value="loss">只看輸</option>
      </select>
      <input class="filter-input arena-keyword" type="search" id="arena-keyword" placeholder="姓名或組別" aria-label="姓名或組別關鍵字">
      <button type="button" class="filter-clear" id="arena-filter-clear">清除</button>
    </div>
    <div class="panel-body" id="arena-body">
      <div class="state-msg"><div class="spinner"></div>載入帳冊…</div>
    </div>
  </div>
  <aside class="strategy-card surface ledger-corners" id="strategy-card" aria-label="策略 E 開獎資訊">
    <div class="strategy-card-head">STRATEGY E</div>
    <div class="strategy-rows" id="strategy-rows">
      <div class="strategy-row is-empty"><strong class="strategy-game">加州彩</strong><span class="strategy-current">載入中…</span></div>
      <div class="strategy-row is-empty"><strong class="strategy-game">今彩539</strong><span class="strategy-current">載入中…</span></div>
    </div>
  </aside>
  </div>

  <div class="panel payroll-panel surface ledger-corners" id="panel-payroll">
    <a class="payroll-open-link" id="payroll-open-link" href="https://at19750919-star.github.io/xjd-payroll/?v=latest-week" target="_blank" rel="noopener">放大開啟</a>
    <div class="payroll-frame-wrap">
      <iframe class="payroll-frame" id="payroll-frame" title="薪資結算" src="https://at19750919-star.github.io/xjd-payroll/?v=latest-week"></iframe>
    </div>
  </div>
</section>

<section class="bottom">
  <div class="notes-panel surface" id="quick-loan-section">
    <div class="sub-head">
      <button type="button" class="collapse-toggle" data-collapse-panel="quick-loan-section" aria-expanded="false">借貸快速操作</button>
      <span class="quick-loan-modes" aria-label="選擇借貸操作">
        <button class="quick-loan-mode is-active" type="button" data-quick-loan-mode="add" aria-pressed="true">新增借款人</button>
        <button class="quick-loan-mode" type="button" data-quick-loan-mode="edit" aria-pressed="false">修改借款人</button>
      </span>
    </div>
    <form class="quick-loan-form" id="quick-loan-form" data-quick-loan-panel="add" novalidate>
      <label class="quick-loan-field">
        <span>借款人</span>
        <span class="quick-loan-input-wrap"><input class="quick-loan-input" id="quick-loan-name" type="text" maxlength="80" placeholder="王小明" autocomplete="off"></span>
      </label>
      <label class="quick-loan-field">
        <span>本金</span>
        <span class="quick-loan-input-wrap"><input class="quick-loan-input" id="quick-loan-principal" type="text" inputmode="decimal" placeholder="250"><span class="quick-loan-unit">萬</span></span>
      </label>
      <label class="quick-loan-field">
        <span>每月應收</span>
        <span class="quick-loan-input-wrap"><input class="quick-loan-input" id="quick-loan-monthly" type="text" inputmode="decimal" placeholder="5"><span class="quick-loan-unit">萬</span></span>
      </label>
      <label class="quick-loan-field">
        <span>收款日</span>
        <span class="quick-loan-input-wrap"><input class="quick-loan-input" id="quick-loan-day" type="text" inputmode="numeric" placeholder="15"><span class="quick-loan-unit">日</span></span>
      </label>
      <label class="quick-loan-field">
        <span>借款起始日</span>
        <span class="quick-loan-input-wrap"><input class="quick-loan-input" id="quick-loan-date" type="date"></span>
      </label>
      <label class="quick-loan-field">
        <span>首次預收</span>
        <span class="quick-loan-input-wrap"><input class="quick-loan-input" id="quick-loan-prepaid" type="text" inputmode="numeric" placeholder="2"><span class="quick-loan-unit">期</span></span>
      </label>
      <button class="quick-loan-submit" id="quick-loan-submit" type="submit">送給 AI</button>
      <button class="quick-loan-clear" id="quick-loan-clear" type="button">清空</button>
      <div class="quick-loan-error" id="quick-loan-error" role="status" aria-live="polite"></div>
    </form>
    <form class="quick-loan-form quick-loan-edit-form" id="quick-edit-form" data-quick-loan-panel="edit" novalidate hidden>
      <label class="quick-loan-field">
        <span>借款人</span>
        <span class="quick-loan-input-wrap"><select class="quick-loan-input" id="quick-edit-borrower"><option value="">載入借款人…</option></select></span>
      </label>
      <label class="quick-loan-field">
        <span>修改項目</span>
        <span class="quick-loan-input-wrap">
          <select class="quick-loan-input" id="quick-edit-item">
            <option value="principal">本金</option>
            <option value="monthlyAmount">每月應收</option>
            <option value="day">收款日</option>
          </select>
        </span>
      </label>
      <label class="quick-loan-field">
        <span id="quick-edit-value-label">修改後本金</span>
        <span class="quick-loan-input-wrap"><input class="quick-loan-input" id="quick-edit-value" type="text" inputmode="decimal" placeholder="250"><span class="quick-loan-unit" id="quick-edit-unit">萬</span></span>
      </label>
      <button class="quick-loan-submit" id="quick-edit-submit" type="submit">送給 AI</button>
      <button class="quick-loan-clear" id="quick-edit-clear" type="button">清空</button>
      <div class="quick-loan-error" id="quick-edit-error" role="status" aria-live="polite"></div>
    </form>
  </div>
  <div class="log-panel surface" id="recent-log-section">
    <div class="sub-head">
      <button type="button" class="collapse-toggle" data-collapse-panel="recent-log-section" aria-expanded="false">最近指令 / 更新</button>
      <span class="hint" id="log-count"></span>
    </div>
    <div class="log-list" id="log-list">
      <div class="log-empty">尚無紀錄</div>
    </div>
  </div>
</section>

</main>

<aside class="loan-hover-card" id="loan-hover-card" role="tooltip" hidden></aside>

<div class="ai-chat-shell" id="ai-chat-shell" aria-hidden="true">
  <div class="ai-chat-backdrop" id="ai-chat-backdrop"></div>
  <section class="ai-chat-panel" id="ai-chat-panel" role="dialog" aria-modal="true" aria-labelledby="ai-chat-title">
    <header class="ai-chat-head" id="ai-chat-head" title="拖曳標題列可移動視窗；雙擊還原位置">
      <div>
        <span class="ai-chat-kicker">OPERATIONS LEDGER · AI</span>
        <div class="ai-chat-title-row">
          <h2 class="ai-chat-title" id="ai-chat-title">營運對話簿</h2>
          <span class="ai-chat-mode">帳冊唯讀 · 設定需確認</span>
        </div>
      </div>
      <div class="ai-chat-tools">
        <button type="button" class="ai-chat-reset" id="ai-chat-clear">清空對話</button>
        <button type="button" class="ai-chat-reset" id="ai-settings-reset">重設版面</button>
        <button type="button" class="ai-chat-close" id="ai-chat-close" aria-label="關閉對話">×</button>
      </div>
    </header>
    <div class="ai-chat-messages" id="ai-output" aria-live="polite">
      <div class="ai-chat-empty" id="ai-chat-empty">
        <strong>營運助理已就緒</strong>
        <span>可以詢問帳冊，也可以說「把零用金移到左邊」、「零用金只顯示 20 筆」；設定會先讓你預覽確認。</span>
      </div>
      <div class="ai-chat-typing" id="ai-chat-typing">正在核對工作台資料</div>
    </div>

  function pad2(n) { return String(n).padStart(2, "0"); }

  function fitDeskToViewport() {

    canvas.style.zoom = String(scale);
  }

  function formatMoney(n) {
    if (n == null || n === "" || Number.isNaN(Number(n))) return "—";
    const num = Number(n);
    const abs = Math.abs(num);
    const formatted = abs.toLocaleString("zh-TW", { maximumFractionDigits: 0 });
    if (num < 0) return "-" + formatted;
    return formatted;
  }

  function formatMoneySigned(n) {
    if (n == null || n === "" || Number.isNaN(Number(n))) return "—";
    const num = Number(n);
    const abs = Math.abs(num);
    const formatted = abs.toLocaleString("zh-TW", { maximumFractionDigits: 0 });
    if (num > 0) return "+" + formatted;
    if (num < 0) return "-" + formatted;
    return "0";
  }

  function formatWan(n) {
    const value = Number(n) || 0;
    return (value / 10000).toLocaleString("zh-TW", { maximumFractionDigits: 2 }) + " 萬";
  }

  function normalizeDate(raw) {
    if (raw == null || raw === "") return null;
    if (raw instanceof Date && !Number.isNaN(raw.getTime())) {
      return raw.getFullYear() + "-" + pad2(raw.getMonth() + 1) + "-" + pad2(raw.getDate());
    }
    const s = String(raw).trim();
    const iso = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (iso) return iso[1] + "-" + iso[2] + "-" + iso[3];
    const slash = s.match(/^(\d{4})\/(\d{1,2})\/(\d{1,2})/);
    if (slash) return slash[1] + "-" + pad2(+slash[2]) + "-" + pad2(+slash[3]);
    const dash = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if (dash) return dash[1] + "-" + pad2(+dash[2]) + "-" + pad2(+dash[3]);
    const d = new Date(s);
    if (!Number.isNaN(d.getTime())) {
      return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
    }
    return null;
  }

  function todayYMD() {
    const d = new Date();
    return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
  }

  function parseYMD(ymd) {
    if (!ymd) return null;
    const p = ymd.split("-");
    return new Date(+p[0], +p[1] - 1, +p[2]);
  }

  function daysBetween(a, b) {
    const ms = parseYMD(b).getTime() - parseYMD(a).getTime();
    return Math.round(ms / 86400000);
  }

  function lastDayOfMonth(year, month) {
    return new Date(year, month, 0).getDate();
  }

  function dueDateForMonth(year, month, day) {
    const last = lastDayOfMonth(year, month);
    const d = Math.min(day, last);
    return year + "-" + pad2(month) + "-" + pad2(d);
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function nowStamp() {
    const d = new Date();
    return pad2(d.getHours()) + ":" + pad2(d.getMinutes()) + ":" + pad2(d.getSeconds());
  }

  function fullStamp() {
    const d = new Date();
    return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()) +
      " " + pad2(d.getHours()) + ":" + pad2(d.getMinutes()) + ":" + pad2(d.getSeconds());
  }

  function weatherFromCode(code) {
    const c = Number(code);
    if (c === 0) return { icon: "☀️", text: "晴" };
    if (c === 1) return { icon: "🌤️", text: "大致晴朗" };
    if (c === 2) return { icon: "⛅", text: "局部多雲" };
    if (c === 3) return { icon: "☁️", text: "陰" };
    if (c === 45 || c === 48) return { icon: "🌫️", text: "霧" };
    if (c >= 51 && c <= 57) return { icon: "🌦️", text: "毛毛雨" };
    if (c >= 61 && c <= 67) return { icon: "🌧️", text: "雨" };
    if (c >= 71 && c <= 77) return { icon: "❄️", text: "雪" };
    if (c >= 80 && c <= 82) return { icon: "🌦️", text: "陣雨" };
    if (c >= 85 && c <= 86) return { icon: "🌨️", text: "陣雪" };
    if (c === 95) return { icon: "⛈️", text: "雷雨" };
    if (c === 96 || c === 99) return { icon: "⛈️", text: "雷雹" };
    return { icon: "🌡️", text: "天氣代碼 " + c };
  }

  function paymentTotal(payments) {
    if (!Array.isArray(payments)) return 0;
    return payments.reduce(function (sum, p) {
      return sum + (Number(p.principal) || 0) + (Number(p.interest) || 0);
    }, 0);
  }

  function scheduleBaseDateFor(debtor) {
    const first = normalizeDate(debtor && debtor.firstPaymentDate);
    if (first) return first;
    if (!debtor || !Array.isArray(debtor.payments)) return "";
    const dates = debtor.payments.map(function (p) { return normalizeDate(p.date); })
      .filter(Boolean).sort();
    return dates[0] || "";
  }

  // 與 index.html 相同：起始月份視為第 1 期，之後每個已到收款日的月份再加 1 期。
  // 舊借款人若沒有 firstPaymentDate，改以最早一筆付款日作為起始日。
  function countPeriodsDueForDebtor(debtor, today) {
    const first = scheduleBaseDateFor(debtor);
    if (!first || first > today) return 0;

    const day = Number(debtor.day) || 1;
    const firstD = parseYMD(first);
    let count = 1;
    let cursor = new Date(firstD.getFullYear(), firstD.getMonth() + 1, 1);

    while (true) {
      const due = dueDateForMonth(cursor.getFullYear(), cursor.getMonth() + 1, day);
      if (due > today) break;
      count++;
      cursor = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 1);
      if (count > 600) break;
    }
    return count;
  }

  /* 下次還款日：與主程式 nextDueDateForDebtor 同一套規則
     已收金額換算成幾期 → 起始日往後推那麼多個月的收款日 */
  function nextDueDateFor(debtor) {
    const day = Number(debtor.day) || 1;
    const amount = Number(debtor.amount) || 0;
    if (!amount) return plainNextDueDate(day);

    // 基準日：首次應收日 → 最早一筆還款 → 都沒有就用單純的下一個收款日
    const base = scheduleBaseDateFor(debtor);
    if (!base) return plainNextDueDate(day);

    const covered = Math.floor(paymentTotal(debtor.payments) / amount);
    const baseD = parseYMD(base);
    const target = new Date(baseD.getFullYear(), baseD.getMonth() + covered, 1);
    return dueDateForMonth(target.getFullYear(), target.getMonth() + 1, day);
  }

  function plainNextDueDate(day) {
    const today = todayYMD();
    const t = parseYMD(today);
    const thisMonth = dueDateForMonth(t.getFullYear(), t.getMonth() + 1, day);
    if (thisMonth >= today) return thisMonth;
    const nm = new Date(t.getFullYear(), t.getMonth() + 1, 1);
    return dueDateForMonth(nm.getFullYear(), nm.getMonth() + 1, day);
  }

  function computeDebtorStatus(debtor, today) {
    const day = Number(debtor.day) || 1;
    const received = paymentTotal(debtor.payments);
    const base = scheduleBaseDateFor(debtor);
    const nextDue = base ? nextDueDateFor(debtor) : "";
    const todayD = parseYMD(today);
    const dueThisMonth = dueDateForMonth(todayD.getFullYear(), todayD.getMonth() + 1, day);

    // 有起始資料時，以「已收金額能覆蓋到哪一期」推算真正下一個應收日。
    // 這可保留上月未繳的逾期，不會因月份切換而重設成待收。
    if (nextDue) {
      if (nextDue < today) {
        const overdueDays = daysBetween(nextDue, today);
        return { label: "逾期 " + overdueDays + " 天", kind: "overdue", received: received, overdueDays: overdueDays };
      }
      if (nextDue === today) {
        return { label: "今日到期", kind: "due-today", received: received, overdueDays: 0 };
      }
      if (dueThisMonth <= today) {
        return { label: "已收", kind: "paid", received: received, overdueDays: 0 };
      }
      return { label: "待收", kind: "pending", received: received, overdueDays: 0 };
    }

    // 完全沒有起始日或付款紀錄時，只能依本月收款日判斷。
    if (dueThisMonth < today) {
      const overdueDays = daysBetween(dueThisMonth, today);
      return { label: "逾期 " + overdueDays + " 天", kind: "overdue", received: received, overdueDays: overdueDays };
    }
    if (dueThisMonth === today) {
      return { label: "今日到期", kind: "due-today", received: received, overdueDays: 0 };
    }
    return { label: "待收", kind: "pending", received: received, overdueDays: 0 };
  }

  function buildLoanRows(debtors) {
    const today = todayYMD();
    const rows = [];
    (debtors || []).forEach(function (d) {
      if (d.closedAt) return;
      const st = computeDebtorStatus(d, today);
      rows.push({
        id: d.id,
        name: d.name || "—",
        day: d.day,
        principal: Number(d.principal) || 0,
        amount: Number(d.amount) || 0,
        received: st.received,
        status: st.label,
        statusKind: st.kind,
        overdueDays: st.overdueDays,
        raw: d
      });
    });
    const order = { overdue: 0, "due-today": 1, pending: 2, paid: 3 };
    rows.sort(function (a, b) {
      const oa = order[a.statusKind] != null ? order[a.statusKind] : 9;
      const ob = order[b.statusKind] != null ? order[b.statusKind] : 9;
      if (oa !== ob) return oa - ob;
      if (a.overdueDays !== b.overdueDays) return b.overdueDays - a.overdueDays;
      return String(a.name).localeCompare(String(b.name), "zh-Hant");
    });
    return rows;
  }

  async function fetchJson(url) {
    const res = await fetch(url, { method: "GET", cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);

    const numbers = item.numbers.map(function (number) { return String(number).padStart(2, "0"); }).join("、");
    const heads = Array.isArray(item.nextHeads) ? item.nextHeads.join("頭 × ") + "頭" : (item.nextHeads || "—");
    return '<div class="strategy-row" data-strategy-game="' + key + '">' +
      '<strong class="strategy-game">' + label + '</strong>' +
      '<span class="strategy-date">' + escapeHtml(item.date + (item.time ? "  " + item.time : "")) + '</span>' +
      '<span class="strategy-current">本期：' + escapeHtml(numbers) + '</span>' +
      '<span class="strategy-next">下期預計:<b class="strategy-heads">' + escapeHtml(heads) + '</b></span></div>';
  }

          '<div class="strategy-row is-empty"><strong class="strategy-game">今彩539</strong><span class="strategy-date">重新連線中</span><span class="strategy-current">資料暫時無法取得</span><span class="strategy-next">—</span></div>';

  function tickClock() {
    const d = new Date();
    document.getElementById("clock-time").textContent =

  function isLifanLoanRow(row) {
    return /(?:\(|（)\s*立帆\s*(?:\)|）)/.test(String(row && row.name || ""));
  }

  function loanSummaryHtml(label, rows, className, subtitle) {
    const loading = rows == null;
    const list = loading ? [] : rows;
    const totals = list.reduce(function (sum, row) {
      sum.principal += Number(row.principal) || 0;
      sum.monthly += Number(row.amount) || 0;
      sum.received += Number(row.received) || 0;
      if (row.statusKind === "overdue") sum.overdue++;
      return sum;
    }, { principal: 0, monthly: 0, received: 0, overdue: 0 });
    const value = function (number, money) {
      return loading ? "—" : (money ? formatWan(number) : String(number));
    };
    return '<section class="loan-kpi-group ' + (className || "") + '">' +
      '<div class="loan-kpi-group-name"><strong>' + escapeHtml(label) + '</strong><span>' +
        (loading ? "載入中" : escapeHtml((subtitle ? subtitle + " · " : "") + list.length + " 人")) + '</span></div>' +
      '<div class="loan-kpi"><span class="loan-kpi-label">本金</span><strong class="loan-kpi-value">' + value(totals.principal, true) + '</strong></div>' +
      '<div class="loan-kpi"><span class="loan-kpi-label">月收</span><strong class="loan-kpi-value">' + value(totals.monthly, true) + '</strong></div>' +
      '<div class="loan-kpi"><span class="loan-kpi-label">已收</span><strong class="loan-kpi-value">' + value(totals.received, true) + '</strong></div>' +
      '<div class="loan-kpi"><span class="loan-kpi-label">逾期</span><strong class="loan-kpi-value">' + value(totals.overdue, false) + '</strong></div>' +
      '</section>';
  }

  function loanTableRowHtml(r) {
    const pillClass = r.statusKind === "overdue" ? "overdue"
      : r.statusKind === "due-today" ? "due-today"
      : r.statusKind === "paid" ? "paid" : "pending";

      "<td data-col=\"day\" class=\"num\">" + escapeHtml(String(r.day)) + "</td>" +
      "<td data-col=\"principal\" class=\"num\">" + formatMoney(r.principal) + "</td>" +
      "<td data-col=\"monthly\" class=\"num\">" + formatMoney(r.amount) + "</td>" +
      "<td data-col=\"received\" class=\"num\">" + formatMoney(r.received) + "</td>" +
      "<td data-col=\"status\"><span class=\"status-pill " + pillClass + "\">" + escapeHtml(r.status) + "</span>" +
        (r.statusKind === "overdue" || r.statusKind === "due-today"

  function loanHoverValue(label, value, empty) {
    return '<span class="loan-hover-label">' + escapeHtml(label) + '</span>' +
      '<span class="loan-hover-value' + (empty ? ' is-empty' : '') + '">' + escapeHtml(value) + '</span>';

  function hideLoanHoverCard() {
    const card = document.getElementById("loan-hover-card");
    if (card) card.hidden = true;
  }

  function showLoanHoverCard(target) {
    const id = target && target.dataset ? target.dataset.loanDetailsId : "";
    const row = (state.loan.rows || []).find(function (item) { return String(item.id) === String(id); });
    if (!row) return;
    const raw = row.raw || {};
    const interestNumber = Number(raw.interest);
    const hasInterest = raw.interest !== "" && raw.interest != null && Number.isFinite(interestNumber);
    const phone = String(raw.phone || "").trim();
    const notes = String(raw.notes || "").trim();
    const card = document.getElementById("loan-hover-card");
    card.classList.toggle("is-lifan", isLifanLoanRow(row));
    card.innerHTML = '<div class="loan-hover-title">' + escapeHtml(row.name) + '</div>' +
      '<div class="loan-hover-grid">' +
        loanHoverValue("姓名", row.name, false) +
        loanHoverValue("月付款日", "每月 " + row.day + " 日", false) +
        loanHoverValue("月應收金額", formatMoney(row.amount) + " 元", false) +
        loanHoverValue("本金", formatMoney(row.principal) + " 元", false) +
        loanHoverValue("利息", hasInterest ? formatMoney(interestNumber) + " 元" : "未設定", !hasInterest) +
        loanHoverValue("電話", phone || "未設定", !phone) +
        loanHoverValue("備註", notes || "未設定", !notes) +
      '</div>';
    card.hidden = false;
    card.style.visibility = "hidden";
    const rect = target.getBoundingClientRect();
    const width = card.offsetWidth;
    const height = card.offsetHeight;
    let left = rect.right + 10;
    if (left + width > window.innerWidth - 10) left = rect.left - width - 10;
    left = Math.max(10, left);
    const top = Math.max(10, Math.min(rect.top, window.innerHeight - height - 10));
    card.style.left = left + "px";
    card.style.top = top + "px";
    card.style.visibility = "visible";
  }

  function renderLoan() {
    hideLoanHoverCard();
    const body = document.getElementById("loan-body");
    const stats = document.getElementById("loan-stats");
    const s = state.loan;

    if (s.status === "loading") {
      body.innerHTML = '<div class="state-msg"><div class="spinner"></div>載入中…</div>';

      stats.innerHTML = '<div class="loan-kpi is-error"><span class="loan-kpi-label">借貸總覽</span><strong class="loan-kpi-value">讀取失敗</strong></div>';

      "<th data-col=\"monthly\" class=\"num\">月收</th><th data-col=\"received\" class=\"num\">已收</th><th data-col=\"status\">狀態</th>" +
      "</tr></thead><tbody>";

    const sortedRows = function (groupRows) { return groupRows.map(function (row, index) {
      return { row: row, index: index };
    }).sort(function (a, b) {
      const dayA = Number(a.row.day);
      const dayB = Number(b.row.day);
      const safeDayA = Number.isFinite(dayA) ? dayA : 99;
      const safeDayB = Number.isFinite(dayB) ? dayB : 99;
      return safeDayA - safeDayB || a.index - b.index;
    }).map(function (item) { return item.row; }); };

    [
      { label: "主要帳", rows: sortedRows(primaryRows), className: "" },
      { label: "立帆｜其他股東", rows: sortedRows(lifanRows), className: "is-lifan" }
    ].forEach(function (group) {

      html += '<tr class="loan-ledger-group-row ' + group.className + '"><td colspan="6">' +
        escapeHtml(group.label) + '<span class="loan-ledger-group-count">' + group.rows.length + ' 人</span></td></tr>';
      limitedRows("loan", group.rows).forEach(function (row) {
        html += loanTableRowHtml(row);
      });

    html += "</tbody></table>";
    body.innerHTML = html;
    applyColumnOrder("loan", body);

  function pettyItemName(record) {
    const item = String(record && record.item || "").trim();
    if (["早餐", "午餐", "晚餐"].includes(item)) return "餐費（" + item + "）";
    if (item === "加油") {
      const vehicle = String(record && (record.vehicle || record.car || record["車輛"]) || "").trim();
      return vehicle ? "加油（" + vehicle + "）" : "加油";
    }
    return item || "未分類";
  }

  function pettyUsageName(record) {
    const raw = String(record && (record.usage || record.category || record.scope || record.accountType || record["用途"] || record["分類"]) || "").trim();
    if (/^(公司|公用|company|business)$/i.test(raw)) return "公司";
    if (/^(家用|家庭|私人|個人|home|personal)$/i.test(raw)) return "家用";
    return raw;
  }

  function filteredPettyRecords(records) {
    return records.filter(function (record) {
      const date = normalizeDate(record.date) || "";
      if (pettyFilters.start && (!date || date < pettyFilters.start)) return false;
      if (pettyFilters.end && (!date || date > pettyFilters.end)) return false;
      if (pettyFilters.usage && pettyUsageName(record) !== pettyFilters.usage) return false;
      if (pettyFilters.items.size && !pettyFilters.items.has(pettyItemName(record))) return false;
      return true;
    });
  }

  function syncPettyFilterOptions(records) {
    const options = document.getElementById("petty-item-options");
    const names = Array.from(new Set(records.map(pettyItemName))).sort(function (a, b) {
      return a.localeCompare(b, "zh-Hant");
    });
    Array.from(pettyFilters.items).forEach(function (name) {
      if (!names.includes(name)) pettyFilters.items.delete(name);
    });
    options.innerHTML = "";
    names.forEach(function (name) {
      const label = document.createElement("label");
      label.className = "multi-filter-option";
      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.value = name;
      checkbox.checked = pettyFilters.items.has(name);
      const text = document.createElement("span");
      text.textContent = name;
      label.appendChild(checkbox);
      label.appendChild(text);
      options.appendChild(label);
    });
    const selected = pettyFilters.items.size;
    document.getElementById("petty-item-summary").textContent = selected ? "項目：已選 " + selected + " 項" : "項目：全部";
  }

  function renderPetty() {
    const body = document.getElementById("petty-body");
    const stats = document.getElementById("petty-stats");
    const s = state.petty;

    if (s.status === "loading") {
      body.innerHTML = '<div class="state-msg"><div class="spinner"></div>載入中…</div>';
      stats.innerHTML = "";
      return;
    }
    if (s.status === "error") {
      body.innerHTML = '<div class="state-msg error">讀取失敗<br><span style="font-size:11px;opacity:.7">' +

      stats.innerHTML = '<span class="stat danger"><span class="stat-val">錯誤</span></span>';
      return;
    }

    const records = s.records || [];
    syncPettyFilterOptions(records);
    const bal = Number(s.balance) || 0;
    const balClass = bal >= 0 ? "ok" : "danger";
    const filtered = filteredPettyRecords(records);
    stats.innerHTML =
      '<span class="stat ' + balClass + '"><span class="stat-label">餘額</span><span class="stat-val">' + formatMoney(bal) + "</span></span>" +
      '<span class="stat neutral"><span class="stat-label">顯示</span><span class="stat-val">' + filtered.length + " / " + records.length + "</span></span>";

    if (!records.length) {
      body.innerHTML = '<div class="state-msg">目前沒有零用金紀錄</div>';
      return;
    }
    if (!filtered.length) {
      body.innerHTML = '<div class="state-msg">沒有符合查詢條件的紀錄</div>';
      return;
    }

    const sorted = filtered.slice().sort(function (a, b) {
      const da = normalizeDate(a.date) || "";
      const db = normalizeDate(b.date) || "";
      if (da !== db) return db.localeCompare(da);
      return 0;
    });

    let html = '<table class="data-table"><thead><tr>' +
      "<th data-col=\"date\">日期</th><th data-col=\"usage\">用途</th><th data-col=\"item\">項目</th><th data-col=\"amount\" class=\"num\">異動</th>" +
      "<th data-col=\"balance\" class=\"num\">結餘</th><th data-col=\"note\">備註</th>" +
      "<th data-col=\"receipt\">發票</th>" +
      "</tr></thead><tbody>";

    limitedRows("petty", sorted).forEach(function (r) {
      const amt = Number(r.amount) || 0;
      const cls = amt > 0 ? "pos" : amt < 0 ? "neg" : "muted";
      const note = r.description != null ? r.description : "";
      html += "<tr>" +
        "<td data-col=\"date\">" + escapeHtml(normalizeDate(r.date) || r.date || "—") + "</td>" +
        "<td data-col=\"usage\">" + escapeHtml(pettyUsageName(r) || "—") + "</td>" +
        "<td data-col=\"item\" title=\"" + escapeHtml(pettyItemName(r)) + "\">" + escapeHtml(pettyItemName(r)) + "</td>" +
        "<td data-col=\"amount\" class=\"num " + cls + "\">" + formatMoneySigned(amt) + "</td>" +
        "<td data-col=\"balance\" class=\"num\">" + formatMoney(r.balance) + "</td>" +
        "<td data-col=\"note\" class=\"muted\" title=\"" + escapeHtml(note) + "\">" + escapeHtml(note || "—") + "</td>" +
        "<td data-col=\"receipt\">" + arenaImageLink(r.receiptUrl, "發票") + "</td>" +
        "</tr>";
    });
    html += "</tbody></table>";
    body.innerHTML = html;
    applyColumnOrder("petty", body);
  }

  function filteredArenaRecords(records) {
    const keyword = arenaFilters.keyword.trim().toLowerCase();
    return records.filter(function (r) {
      const date = normalizeDate(r.date) || String(r.date || "");
      if (arenaFilters.start && (!date || date < arenaFilters.start)) return false;
      if (arenaFilters.end && (!date || date > arenaFilters.end)) return false;
      const result = Number(r.result);
      if (arenaFilters.result === "win" && !(result > 0)) return false;
      if (arenaFilters.result === "loss" && !(result < 0)) return false;
      if (keyword) {
        const searchable = (String(r.name || "") + " " + String(r.group || "")).toLowerCase();
        if (!searchable.includes(keyword)) return false;
      }
      return true;
    });
  }

  function renderArenaStatsOnly(recordsOverride) {
    const s = state.arena;
    const select = document.getElementById("arena-sheet-select");
    const parent = document.getElementById("arena-stats");
    const records = Array.isArray(recordsOverride) ? recordsOverride : (s.records || []);
    let sumResult = 0, sumRolling = 0, nResult = 0, nRolling = 0;
    records.forEach(function (r) {
      if (r.result != null && r.result !== "" && !Number.isNaN(Number(r.result))) {
        sumResult += Number(r.result);
        nResult++;
      }
      if (r.rolling != null && r.rolling !== "" && !Number.isNaN(Number(r.rolling))) {
        sumRolling += Number(r.rolling);
        nRolling++;
      }
    });

    const resClass = sumResult > 0 ? "ok" : sumResult < 0 ? "danger" : "neutral";
    const allRecords = s.records || [];
    let fullResult = 0, fullRolling = 0;
    allRecords.forEach(function (r) {
      if (r.result != null && r.result !== "" && !Number.isNaN(Number(r.result))) fullResult += Number(r.result);
      if (r.rolling != null && r.rolling !== "" && !Number.isNaN(Number(r.rolling))) fullRolling += Number(r.rolling);
    });
    const sheetTotal = s.total != null && !Number.isNaN(Number(s.total))
      ? Number(s.total)
      : -(fullResult + fullRolling * ARENA_ROLLING_RATE);
    const totalClass = sheetTotal > 0 ? "ok" : sheetTotal < 0 ? "danger" : "neutral";

    Array.from(parent.children).forEach(function (ch) {
      if (ch.id !== "arena-sheet-select") ch.remove();
    });

    function addStat(html) {
      const wrap = document.createElement("span");
      wrap.innerHTML = html;
      parent.insertBefore(wrap.firstChild, select);
    }

    if (s.status === "ok") {
      addStat('<span class="stat is-clickable ' + resClass + '" data-arena-daily="1" title="點擊看每日明細"><span class="stat-label">輸贏</span><span class="stat-val">' + formatMoneySigned(sumResult) + "</span></span>");
      addStat('<span class="stat is-clickable info" data-arena-daily="1" title="點擊看每日明細"><span class="stat-label">洗碼</span><span class="stat-val">' + formatMoney(sumRolling) + "</span></span>");
      addStat('<span class="stat is-clickable ' + totalClass + '" data-arena-daily="1" title="工作表 U10 · 點擊看每日明細"><span class="stat-label">總計</span><span class="stat-val">' + formatMoneySigned(sheetTotal) + "</span></span>");
      addStat('<span class="stat neutral"><span class="stat-label">筆數</span><span class="stat-val">' + records.length + "</span></span>");
    }
  }

  /* 每日明細：依日期分組，總計 = 輸贏 + 洗碼 × 200 */
  function arenaDailyRows(records) {
    const byDate = {};
    (records || []).forEach(function (r) {
      const date = normalizeDate(r.date) || String(r.date || "");
      if (!date) return;
      if (!byDate[date]) byDate[date] = { date: date, result: 0, rolling: 0, count: 0 };
      const res = Number(r.result);
      const roll = Number(r.rolling);
      if (r.result != null && r.result !== "" && !Number.isNaN(res)) byDate[date].result += res;
      if (r.rolling != null && r.rolling !== "" && !Number.isNaN(roll)) byDate[date].rolling += roll;
      byDate[date].count++;
    });
    return Object.keys(byDate).sort().map(function (d) {
      const row = byDate[d];
      row.total = row.result + row.rolling * ARENA_ROLLING_RATE;
      return row;
    });
  }

  function shortDate(ymd) {
    const parts = String(ymd).split("-");
    return parts.length === 3 ? Number(parts[1]) + "/" + parts[2] : ymd;
  }

  function openArenaDaily() {
    const s = state.arena;
    if (s.status !== "ok") return;
    const rows = arenaDailyRows(filteredArenaRecords(s.records || []));
    const body = document.getElementById("arena-daily-body");

    document.getElementById("arena-daily-title").textContent =
      "小巨蛋每日明細" + (s.sheet ? " · " + s.sheet : "");

    if (!rows.length) {
      body.innerHTML = '<div class="state-msg">沒有符合查詢條件的紀錄</div>';
    } else {
      let sumResult = 0, sumRolling = 0, sumCount = 0;
      let html = '<table class="data-table"><thead><tr>' +
        "<th>日期</th><th class=\"num\">輸贏</th><th class=\"num\">洗碼</th>" +
        "<th class=\"num\">總計</th><th class=\"num\">筆數</th>" +
        "</tr></thead><tbody>";
      rows.forEach(function (r) {
        sumResult += r.result;
        sumRolling += r.rolling;
        sumCount += r.count;
        html += "<tr>" +
          "<td>" + escapeHtml(shortDate(r.date)) + "</td>" +
          "<td class=\"num " + signClass(r.result) + "\">" + formatMoneySigned(r.result) + "</td>" +
          "<td class=\"num\">" + formatMoney(r.rolling) + "</td>" +
          "<td class=\"num " + signClass(r.total) + "\">" + formatMoneySigned(r.total) + "</td>" +
          "<td class=\"num\">" + r.count + "</td>" +
          "</tr>";
      });
      const sumTotal = sumResult + sumRolling * ARENA_ROLLING_RATE;
      html += "</tbody><tfoot><tr>" +
        "<td>合計</td>" +
        "<td class=\"num " + signClass(sumResult) + "\">" + formatMoneySigned(sumResult) + "</td>" +
        "<td class=\"num\">" + formatMoney(sumRolling) + "</td>" +
        "<td class=\"num " + signClass(sumTotal) + "\">" + formatMoneySigned(sumTotal) + "</td>" +
        "<td class=\"num\">" + sumCount + "</td>" +
        "</tr></tfoot></table>";
      body.innerHTML = html;
    }

    const lightbox = document.getElementById("arena-daily-lightbox");
    lightbox.classList.add("is-open");
    lightbox.setAttribute("aria-hidden", "false");
    document.getElementById("arena-daily-close").focus();
  }

  function closeArenaDaily() {
    const lightbox = document.getElementById("arena-daily-lightbox");
    lightbox.classList.remove("is-open");
    lightbox.setAttribute("aria-hidden", "true");
  }

  function signClass(n) {
    return n > 0 ? "pos" : n < 0 ? "neg" : "muted";
  }

  function populateSheetSelect(sheets, current) {
    const select = document.getElementById("arena-sheet-select");
    const list = Array.isArray(sheets) ? sheets.slice() : [];
    select.innerHTML = "";
    if (!list.length) {
      select.innerHTML = '<option value="">—</option>';
      select.disabled = true;
      return;
    }
    list.slice().reverse().forEach(function (sh) {
      const opt = document.createElement("option");
      opt.value = sh;
      opt.textContent = sh;
      if (sh === current) opt.selected = true;
      select.appendChild(opt);
    });
    if (current && !list.includes(current)) {
      const opt = document.createElement("option");
      opt.value = current;
      opt.textContent = current;
      opt.selected = true;
      select.appendChild(opt);
    }
    select.disabled = false;
  }

  function latestArenaWeekSheet(sheets) {
    return (Array.isArray(sheets) ? sheets : []).find(function (sheet) {
      return /^\d{4}$/.test(String(sheet || "").trim());
    }) || "";
  }

  function arenaImageLink(url, label) {
    if (!url) return '<span class="muted">—</span>';
    const safeUrl = escapeHtml(String(url));
    return '<a class="arena-link" href="' + safeUrl + '" data-arena-image="' + safeUrl +
      '" data-arena-label="' + escapeHtml(label) + '" target="_blank" rel="noopener">開啟</a>';

      const parent = document.getElementById("arena-stats");
      Array.from(parent.children).forEach(function (ch) {
        if (ch.id !== "arena-sheet-select") ch.remove();
      });
      const err = document.createElement("span");
      err.className = "stat danger";
      err.innerHTML = '<span class="stat-val">錯誤</span>';
      parent.insertBefore(err, document.getElementById("arena-sheet-select"));
      return;
    }

    populateSheetSelect(s.sheets, s.sheet);
    const dateRangeActive = !!(arenaFilters.start || arenaFilters.end);
    const records = dateRangeActive && (s.allRecords || []).length ? s.allRecords : (s.records || []);
    if (!records.length) {
      renderArenaStatsOnly(records);
      body.innerHTML = '<div class="state-msg">本週尚無紀錄</div>';
      return;
    }

    const filtered = filteredArenaRecords(records);
    renderArenaStatsOnly(filtered);
    if (!filtered.length) {
      body.innerHTML = '<div class="state-msg">沒有符合查詢條件的紀錄</div>';
      return;
    }

    const sorted = filtered.slice().sort(function (a, b) {
      const dateOrder = String(normalizeDate(b.date) || b.date || "")
        .localeCompare(String(normalizeDate(a.date) || a.date || ""));
      if (dateOrder) return dateOrder;
      return String(a.seq || "").localeCompare(String(b.seq || ""), "zh-Hant", {
        numeric: true,
        sensitivity: "base"
      });
    });

    let html = '<table class="data-table"><thead><tr>' +
      "<th data-col=\"date\">日期</th><th data-col=\"seq\">單號</th><th data-col=\"group\">組別</th><th data-col=\"name\">姓名</th>" +
      "<th data-col=\"result\" class=\"num\">勝負</th><th data-col=\"rolling\" class=\"num\">洗碼</th>" +
      "<th data-col=\"redSlip\">紅單</th><th data-col=\"lineReport\">線報表</th><th data-col=\"note\">備註</th>" +
      "</tr></thead><tbody>";

    limitedRows("arena", sorted).forEach(function (r) {
      const res = r.result;
      const roll = r.rolling;
      let resHtml, rollHtml;
      if (res == null || res === "") {
        resHtml = '<span class="muted">—</span>';
      } else {
        const n = Number(res);
        const cls = n > 0 ? "pos" : n < 0 ? "neg" : "muted";
        resHtml = '<span class="' + cls + '">' + formatMoneySigned(n) + "</span>";
      }
      if (roll == null || roll === "") {
        rollHtml = '<span class="muted">—</span>';
      } else {
        rollHtml = formatMoney(roll);
      }
      const note = r.note != null ? r.note : "";
      html += "<tr>" +
        "<td data-col=\"date\">" + escapeHtml(normalizeDate(r.date) || r.date || "—") + "</td>" +
        "<td data-col=\"seq\">" + escapeHtml(r.seq || "—") + "</td>" +
        "<td data-col=\"group\">" + escapeHtml(r.group || "—") + "</td>" +
        "<td data-col=\"name\" title=\"" + escapeHtml(r.name || "") + "\">" + escapeHtml(r.name || "—") + "</td>" +
        "<td data-col=\"result\" class=\"num\">" + resHtml + "</td>" +
        "<td data-col=\"rolling\" class=\"num\">" + rollHtml + "</td>" +
        "<td data-col=\"redSlip\">" + arenaImageLink(r.redSlip, "紅單") + "</td>" +
        "<td data-col=\"lineReport\">" + arenaImageLink(r.lineReport, "線報表") + "</td>" +
        "<td data-col=\"note\" class=\"muted\" title=\"" + escapeHtml(note) + "\">" + escapeHtml(note || "—") + "</td>" +
        "</tr>";
    });
    html += "</tbody></table>";
    body.innerHTML = html;
    applyColumnOrder("arena", body);
  }

  async function loadArena(sheetName) {
    const requestedSheet = /^\d{4}$/.test(String(sheetName || "").trim())
      ? String(sheetName).trim()
      : "";
    const loadVersion = ++arenaLoadVersion;
    state.arena.status = "loading";
    renderArena();
    try {
      let url = ENDPOINTS.arena;
      if (requestedSheet) url += (url.indexOf("?") >= 0 ? "&" : "?") + "sheet=" + encodeURIComponent(requestedSheet);
      let json = await fetchJson(url);
      if (!json || json.ok === false) {
        throw new Error((json && json.error) || "伺服器回傳失敗");
      }

      // The spreadsheet API may default to a non-week helper sheet (for example
      // "薪資設定"). When the dashboard is in automatic mode, explicitly load
      // the first weekly sheet returned by the API instead.
      if (!requestedSheet) {
        const availableSheets = Array.isArray(json.sheets) ? json.sheets : [];
        const latestWeek = latestArenaWeekSheet(availableSheets);
        if (latestWeek && String(json.sheet || "") !== latestWeek) {
          const latestUrl = ENDPOINTS.arena +
            (ENDPOINTS.arena.indexOf("?") >= 0 ? "&" : "?") +
            "sheet=" + encodeURIComponent(latestWeek);
          const latestJson = await fetchJson(latestUrl);
          if (!latestJson || latestJson.ok === false) {
            throw new Error((latestJson && latestJson.error) || "最新週次讀取失敗");
          }
          if (!Array.isArray(latestJson.sheets)) latestJson.sheets = availableSheets;
          json = latestJson;
        }
      }
      state.arena.sheet = json.sheet || requestedSheet || null;
      state.arena.sheets = (Array.isArray(json.sheets) ? json.sheets : (state.arena.sheets || []))
        .filter(function (sheet) { return /^\d{4}$/.test(String(sheet || "").trim()); });
      state.arena.records = Array.isArray(json.records) ? json.records : [];
      state.arena.allRecords = state.arena.records.map(function (record) {
        return Object.assign({}, record, { week: state.arena.sheet });
      });
      state.arena.allWeeksStatus = "loading";
      const apiTotal = json.U10 != null ? json.U10
        : json.u10 != null ? json.u10
        : json.total != null ? json.total
        : json.summary && json.summary.total != null ? json.summary.total
        : null;
      state.arena.total = apiTotal != null && apiTotal !== "" && !Number.isNaN(Number(apiTotal)) ? Number(apiTotal) : null;
      state.arena.status = "ok";
      state.arena.error = null;
      renderArena();

      const currentSheet = state.arena.sheet;
      const otherSheets = state.arena.sheets.filter(function (week) { return week !== currentSheet; });
      if (!otherSheets.length) {
        state.arena.allWeeksStatus = "ok";
        return;
      }

      Promise.all(otherSheets.map(function (week) {
        const otherUrl = ENDPOINTS.arena + (ENDPOINTS.arena.indexOf("?") >= 0 ? "&" : "?") + "sheet=" + encodeURIComponent(week);
        return fetchJson(otherUrl)
          .then(function (weekJson) {
            if (!weekJson || weekJson.ok === false) return [];
            return (Array.isArray(weekJson.records) ? weekJson.records : []).map(function (record) {
              return Object.assign({}, record, { week: week });
            });
          })
          .catch(function () { return []; });
      })).then(function (weekGroups) {
        if (loadVersion !== arenaLoadVersion) return;
        state.arena.allRecords = state.arena.allRecords.concat([].concat.apply([], weekGroups));
        state.arena.allWeeksStatus = "ok";
        renderArena();
      });
      return;
    } catch (e) {
      if (loadVersion !== arenaLoadVersion) return;
      state.arena.status = "error";
      state.arena.error = (e && e.message) || String(e);
      state.arena.records = [];
      state.arena.allRecords = [];
      state.arena.allWeeksStatus = "error";
      state.arena.total = null;
    }
    renderArena();
  }

  async function submitQuickLoan() {
    const fields = quickLoanFields();
    const error = document.getElementById("quick-loan-error");
    const name = fields.name.value.trim();
    const principalWan = quickLoanNumber(fields.principal.value);
    const monthlyWan = quickLoanNumber(fields.monthly.value);
    const day = quickLoanNumber(fields.day.value);
    const prepaid = quickLoanNumber(fields.prepaid.value);
    const date = fields.date.value;

    let message = "";
    if (!name) message = "請填借款人姓名";
    else if (!(principalWan > 0) || principalWan > 100000) message = "本金請填正確的萬數，例如 250";
    else if (!(monthlyWan > 0) || monthlyWan > 10000) message = "每月應收請填正確的萬數，例如 5";
    else if (!Number.isInteger(day) || day < 1 || day > 31) message = "收款日請填 1～31";
    else if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) message = "請選擇借款起始日";
    else if (!Number.isInteger(prepaid) || prepaid < 0 || prepaid > 12) message = "首次預收請填 0～12 期";

    if (message) {
      error.textContent = message;
      return;
    }

    error.textContent = "";
    saveQuickLoanDraft();
    const principal = Math.round(principalWan * 10000);
    const monthly = Math.round(monthlyWan * 10000);
    const prompt = "請新增借款人：姓名「" + name + "」；本金 " + principal +
      " 元；每月應收 " + monthly + " 元；每月 " + day +
      " 日收款；借款起始日 " + date + "；首次預收 " + prepaid +
      " 期；首期預收以每月應收乘以期數計算；首期預收以外另計已收 0 元；電話空白；備註空白。請建立完整新增預覽。";
    await askAI(prompt);
  }

  function loadChatPos() {
    try {
      const p = JSON.parse(localStorage.getItem(LS_CHAT_POS) || "null");

  function saveChatPos(pos) {
